<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PDF Editor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M6 1.5h8.5l6 6V20a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 20V4A2.5 2.5 0 0 1 6 1.5z' fill='%23b70228'/%3E%3Cpath d='M14.5 1.5v4a2 2 0 0 0 2 2h4z' fill='%23f0a3b3'/%3E%3C/svg%3E">
  <script>
    // Apply the saved (or system) theme before first paint to avoid a flash.
    (function () {
      var theme;
      try { theme = JSON.parse(localStorage.getItem('pdfeditor.theme')); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/controls.css">
  <link rel="stylesheet" href="styles/viewer.css">
  <link rel="stylesheet" href="styles/pdfjs-layers.css">
</head>
<body>
  <div id="app" aria-busy="true">
    <div class="boot-splash" role="status">Loading…</div>
  </div>
  <noscript>PDF Editor needs JavaScript to run.</noscript>
  <script type="module" src="main.js"></script>
</body>
</html>
