    (function () {
      var theme;
      try { theme = JSON.parse(localStorage.getItem('pdfeditor.theme')); } catch (e) {}

        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

      document.documentElement.style.colorScheme = theme;

/* Design tokens. All theming goes through these custom properties.
   The theme is chosen by [data-theme] on <html> (set before first paint). */

:root {
  /* Type */
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-xs: 11px;
  --text-sm: 12px;
  --text-md: 13px;
  --text-lg: 15px;
  --text-xl: 18px;

  /* Spacing (4px grid) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  /* Shape & sizing */
  --radius: 6px;
  --radius-sm: 4px;
  --control-h: 30px;
  --control-h-sm: 28px;
  --control-h-lg: 32px;
  --topbar-h: 40px;
  --statusbar-h: 28px;
  --page-gap: 16px;

  /* Motion */
  --ease: cubic-bezier(.2, .7, .3, 1);
  --dur-fast: 90ms;
  --dur: 160ms;

  /* Accent (shared by both themes) */
  --accent: #b70228;
  --accent-hover: #8a011e;
  --accent-contrast: #ffffff;
  --logo-fold: #f0a3b3;
  --logo-lines: rgba(255, 255, 255, .9);
}

/* Light theme */
:root,
:root[data-theme="light"] {
  --bg: #f6f7f8;
  --panel: #ffffff;
  --panel-2: #f0f2f4;
  --border: #d9dde1;
  --border-strong: #c3c9cf;
  --text: #1e2327;
  --text-muted: #5f6b76;
  --hover: rgba(30, 35, 39, .06);
  --active: rgba(30, 35, 39, .10);
  --canvas: #e4e7ea;
  --page-shadow: 0 1px 3px rgba(0, 0, 0, .14), 0 4px 14px rgba(0, 0, 0, .08);
  --popover-shadow: 0 8px 28px rgba(16, 24, 32, .16), 0 2px 6px rgba(16, 24, 32, .08);
  --focus-ring: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent);
  --accent-text: #b70228;
  --accent-soft: rgba(183, 2, 40, .08);
  --badge-bg: #eceff2;
  --badge-text: #4e5964;
  --danger: #b70228;
  --success: #1d7a45;
  --warning: #9a6200;
}

/* Dark theme */
:root[data-theme="dark"] {
  --bg: #1e2327;
  --panel: #262c31;
  --panel-2: #2e353b;
  --border: #3a4248;
  --border-strong: #4a535a;
  --text: #e6e8ea;
  --text-muted: #9aa3ab;
  --hover: rgba(255, 255, 255, .06);
  --active: rgba(255, 255, 255, .10);
  --canvas: #171b1e;
  --page-shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 4px 16px rgba(0, 0, 0, .35);
  --popover-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35);
  --focus-ring: 0 0 0 2px var(--panel), 0 0 0 4px #e0405f;
  /* crimson text on dark surfaces is too dim for AA; use a lighter tint */
  --accent-text: #ff7a93;
  --accent-soft: rgba(255, 90, 120, .12);
  --badge-bg: #353d44;
  --badge-text: #b7c0c7;
  --danger: #ff6b84;
  --success: #4cc27f;
  --warning: #f0b44c;
}
</style>
  <style data-src="styles/base.css">
/* Reset + base controls shared by every screen. */

*,
*::before,
*::after { box-sizing: border-box; }

html,
body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: var(--text-md)/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: var(--text-xl); font-weight: 600; }
h2 { font-size: var(--text-lg); font-weight: 600; }
h3 { font-size: var(--text-md); font-weight: 600; }

button,
input,
select,
textarea { font: inherit; color: inherit; }

.muted { color: var(--text-muted); }

:focus { outline: none; }
:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.icon { flex: none; display: block; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  height: var(--control-h);
  padding: 0 var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:active:not(:disabled) { background: var(--active); }
.btn:disabled { opacity: .55; cursor: default; }

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-contrast);
}
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn.icon-btn {
  width: var(--control-h-sm);
  height: var(--control-h-sm);
  padding: 0;
  border-color: transparent;
  background: transparent;
  color: var(--text-muted);
}
.btn.icon-btn:hover { color: var(--text); }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 6px;
  border-radius: 9px;
  background: var(--badge-bg);
  color: var(--badge-text);
  font-size: var(--text-xs);
  font-weight: 500;
  white-space: nowrap;
}

/* Boot splash (replaced once the app starts) */
.boot-splash {
  display: grid;
  place-items: center;
  height: 100%;
  color: var(--text-muted);
}
.boot-error {
  max-width: 520px;
  margin: 15vh auto 0;
  padding: var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
}

/* Scrollbars that suit both themes */
* { scrollbar-color: var(--border-strong) transparent; }
</style>
  <style data-src="styles/shell.css">
/* App shell: top bar and main area. */

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.topbar {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex: none;
  height: var(--topbar-h);
  padding: 0 var(--space-2) 0 var(--space-3);
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-weight: 600;
  user-select: none;
}
.brand-name { font-size: var(--text-md); }

.topbar-spacer { flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: var(--space-1); }

.main {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: auto;
}
</style>
  <style data-src="styles/home.css">
/* Home screen. */

.home-inner {
  max-width: 1040px;
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.home-drop {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-6) var(--space-5);
  border: 1.5px dashed var(--border-strong);
  border-radius: calc(var(--radius) * 2);
  background: var(--panel);
  text-align: center;
}
.home-drop-icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  margin-bottom: var(--space-1);
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-text);
}
.home-drop-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-2);
}
.home-privacy {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--space-3);
  color: var(--text-muted);
  font-size: var(--text-sm);
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}

.category + .category { margin-top: var(--space-5); }
.category-title {
  margin-bottom: var(--space-2);
  color: var(--text-muted);
  font-size: var(--text-sm);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
}

.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--space-2);
}
.tool-grid.recommended { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

.tool-card {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 60px;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  text-align: left;
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.tool-card:hover { border-color: var(--border-strong); background: var(--panel-2); }
.tool-card[aria-disabled="true"] { cursor: default; }
.tool-card[aria-disabled="true"] .tool-icon { opacity: .7; }
.tool-card.large { min-height: 68px; }

.tool-icon {
  display: grid;
  place-items: center;
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: var(--radius);
  background: var(--accent-soft);
  color: var(--accent-text);
}
.tool-card.large .tool-icon { width: 40px; height: 40px; }

.tool-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 1;
}
.tool-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  min-width: 0;
}
.tool-label {
  min-width: 0;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tool-desc {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
  color: var(--text-muted);
  font-size: var(--text-sm);
  line-height: 1.35;
}
</style>
</head>

rand-name', t('app.name'))),\n    h('div.topbar-spacer'),\n    h('div.topbar-actions', themeBtn),\n  );\n\n  const main = h('main.main', { id: 'main' });\n  root.replaceChildren(topbar, main);\n  return { topbar, main };\n}\n","@app/ui/theme.js":"// Light/dark theme. First run follows prefers-color-scheme; an explicit\n// choice is remembered. (index.html applies the saved theme before the app\n// loads, so there is no flash.)\nimport { getPref, setPref } from '@app/core/prefs.js';\n\nconst listeners = new Set();\n\nexport function currentTheme() {\n  return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';\n}\n\nfunction systemTheme() {\n  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';\n}\n\nexport function initTheme() {\n  applyTheme(getPref('theme') ?? systemTheme());\n  // Follow the OS only while the user hasn't chosen.\n  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {\n    if (!getPref('theme')) applyTheme(systemTheme());\n  });\n}\n\nexport function setTheme(theme) {\n  setPref('theme', theme);\n  applyTheme(theme);\n}\n\nexport function toggleTheme() {\n  setTheme(currentTheme() === 'dark' ? 'light' : 'dark');\n}\n\nexport function onThemeChange(fn) {\n  listeners.add(fn);\n  return () => listeners.delete(fn);\n}\n\nfunction applyTheme(theme) {\n  document.documentElement.dataset.theme = theme;\n  document.documentElement.style.colorScheme = theme;\n  for (const fn of listeners) fn(theme);\n}\n"}</script>
  <script>

      var code = sources[id] + '\n//# sourceURL=pdf-editor:///' + id.slice(5);
