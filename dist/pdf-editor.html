/* Design tokens. All theming goes through these custom properties.
   The theme is chosen by [data-theme] on <html> (set before first paint). */

:root {
  /* Type */
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-xs: 11px;
  --text-sm: 12px;
  --text-md: 13px;
  --text-lg: 15px;
  --text-xl: 18px;

  /* Spacing (4px grid) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  /* Shape & sizing */
  --radius: 6px;
  --radius-sm: 4px;
  --control-h: 30px;
  --control-h-sm: 28px;
  --control-h-lg: 32px;
  --topbar-h: 40px;
  --statusbar-h: 28px;
  --page-gap: 16px;

  /* Motion */
  --ease: cubic-bezier(.2, .7, .3, 1);
  --dur-fast: 90ms;
  --dur: 160ms;

  /* Accent (shared by both themes) */
  --accent: #b70228;
  --accent-hover: #8a011e;
  --accent-contrast: #ffffff;
  --logo-fold: #f0a3b3;
  --logo-lines: rgba(255, 255, 255, .9);
}

/* Light theme */
:root,
:root[data-theme="light"] {
  --bg: #f6f7f8;
  --panel: #ffffff;
  --panel-2: #f0f2f4;
  --border: #d9dde1;
  --border-strong: #c3c9cf;
  --text: #1e2327;
  --text-muted: #5f6b76;
  --hover: rgba(30, 35, 39, .06);
  --active: rgba(30, 35, 39, .10);
  --canvas: #e4e7ea;
  --page-shadow: 0 1px 3px rgba(0, 0, 0, .14), 0 4px 14px rgba(0, 0, 0, .08);
  --popover-shadow: 0 8px 28px rgba(16, 24, 32, .16), 0 2px 6px rgba(16, 24, 32, .08);
  --focus-ring: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent);
  --accent-text: #b70228;
  --accent-soft: rgba(183, 2, 40, .08);
  --badge-bg: #eceff2;
  --badge-text: #4e5964;
  --danger: #b70228;
  --success: #1d7a45;
  --warning: #9a6200;
}

/* Dark theme */
:root[data-theme="dark"] {
  --bg: #1e2327;
  --panel: #262c31;
  --panel-2: #2e353b;
  --border: #3a4248;
  --border-strong: #4a535a;
  --text: #e6e8ea;
  --text-muted: #9aa3ab;

  --popover-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35);

  --badge-text: #b7c0c7;

}

/* Reset + base controls shared by every screen. */

*,
*::before,
*::after { box-sizing: border-box; }

html,
body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: var(--text-md)/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: var(--text-xl); font-weight: 600; }
h2 { font-size: var(--text-lg); font-weight: 600; }
h3 { font-size: var(--text-md); font-weight: 600; }

button,
input,
select,
textarea { font: inherit; color: inherit; }

.muted { color: var(--text-muted); }

:focus { outline: none; }
:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.icon { flex: none; display: block; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  height: var(--control-h);
  padding: 0 var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:active:not(:disabled) { background: var(--active); }
.btn:disabled { opacity: .55; cursor: default; }

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-contrast);
}
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn.icon-btn {
  width: var(--control-h-sm);
  height: var(--control-h-sm);
  padding: 0;
  border-color: transparent;
  background: transparent;
  color: var(--text-muted);
}
.btn.icon-btn:hover { color: var(--text); }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 6px;
  border-radius: 9px;
  background: var(--badge-bg);
  color: var(--badge-text);
  font-size: var(--text-xs);
  font-weight: 500;
  white-space: nowrap;
}

/* Boot splash (replaced once the app starts) */
.boot-splash {
  display: grid;
  place-items: center;
  height: 100%;
  color: var(--text-muted);
}
.boot-error {
  max-width: 520px;
  margin: 15vh auto 0;
  padding: var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
}

/* Scrollbars that suit both themes */
* { scrollbar-color: var(--border-strong) transparent; }

/* App shell: top bar, workspace (tools panel · viewport · side panel · rail). */

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ---------------------------------------------------------- top bar */
.topbar {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex: none;
  height: var(--topbar-h);
  padding: 0 var(--space-2) 0 var(--space-3);
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  min-width: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex: none;
  font-weight: 600;
  user-select: none;
}
.brand-name { font-size: var(--text-md); white-space: nowrap; }

.menubar-slot { flex: none; }
.menubar { display: flex; align-items: center; gap: 1px; }
.menubar-item {
  height: var(--control-h-sm);
  padding: 0 var(--space-2);
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text);
  cursor: default;

.menubar-item:hover,
.menubar-item[aria-expanded="true"] { background: var(--hover); }

.tabs-slot { flex: 1; min-width: 0; display: flex; }
.topbar-actions { display: flex; align-items: center; gap: var(--space-1); flex: none; }

.palette-btn {

  gap: 6px;
  padding: 0 6px 0 var(--space-2);
  background: var(--panel-2);
  border-color: var(--border);
  color: var(--text-muted);
  font-size: var(--text-sm);
}
.palette-btn kbd {
  padding: 1px 5px;
  border: 1px solid var(--border);

  background: var(--panel);
  font: inherit;
  font-size: var(--text-xs);
}
@media (max-width: 1100px) { .palette-btn-text { display: none; } }

/* ------------------------------------------------------------- tabs */
.tabstrip {
  display: flex;
  align-items: center;
  gap: 2px;
  min-width: 0;
  flex: 1;
  height: 100%;
  padding-left: var(--space-2);
  border-left: 1px solid var(--border);
}
.home-btn[aria-pressed="true"] { color: var(--accent-text); background: var(--accent-soft); }
.tab-scroller {
  display: flex;
  min-width: 0;
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
.tab-scroller::-webkit-scrollbar { display: none; }
.tab-list { display: flex; align-items: stretch; height: 100%; }
.tab-item {
  position: relative;
  display: flex;
  align-items: center;
  flex: none;
  max-width: 220px;
  height: 100%;
  border-right: 1px solid transparent;
}
.tab-item::after {
  content: "";
  position: absolute;
  left: 6px;
  right: 6px;
  bottom: 0;
  height: 2px;
  border-radius: 2px 2px 0 0;
  background: transparent;
}
.tab-item.active::after { background: var(--accent); }
.tab {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  height: 100%;
  padding: 0 28px 0 var(--space-3);
  border: 0;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
}
.tab-item:hover .tab { color: var(--text); }
.tab-item.active .tab { color: var(--text); font-weight: 500; }
.tab:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-dirty { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.tab-close {

  right: 6px;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  padding: 0;

  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  opacity: 0;

.tab-item:hover .tab-close,
.tab-item.active .tab-close { opacity: 1; }
.tab-close:hover { background: var(--hover); color: var(--text); }
.tab-open { flex: none; }

/* --------------------------------------------------------- workspace */
.workspace {
  position: relative;
  display: flex;
  flex: 1;
  min-height: 0;
}
.main {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow: auto;
  order: 3;
}
.tools-panel { order: 1; }
.tools-splitter { order: 2; }
.workspace[data-tools-side="right"] .main { order: 1; }
.workspace[data-tools-side="right"] .tools-panel { order: 3; border-right: 0; border-left: 1px solid var(--border); }

.side-splitter { order: 4; }
.side-panel { order: 5; }
.rail { order: 6; }

.splitter {
  position: relative;
  flex: none;
  width: 5px;
  margin: 0 -2px;
  z-index: 3;
  cursor: col-resize;
  touch-action: none;
}
.splitter[hidden] { display: none; }
.splitter::after {
  content: "";

  inset: 0 2px;
  transition: background var(--dur-fast);

.splitter:hover::after,
.splitter.dragging::after,
.splitter:focus-visible::after { background: var(--accent); }
.splitter:focus-visible { box-shadow: none; }
.resizing, .resizing * { cursor: col-resize !important; user-select: none !important; }

/* Read mode: everything but the pages goes away. */
.read-mode .topbar,
.read-mode .status-slot,
.read-mode .tools-panel,
.read-mode .side-panel,
.read-mode .rail,
.read-mode .splitter { display: none; }

/* Home screen. */

.home-inner {
  max-width: 1040px;
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-6);

/* Shared controls: inputs, status bar, menus, dialogs, toasts. */

.input {
  height: var(--control-h-sm);
  padding: 0 var(--space-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--text);
}
.input:focus-visible { border-color: var(--accent); }
.input[aria-invalid="true"] { border-color: var(--danger); }

.btn.ghost { border-color: transparent; background: transparent; }

.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }
.btn.icon-btn:disabled { opacity: .4; }

.status-slot { flex: none; }
.statusbar {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  height: calc(var(--statusbar-h) + 6px);
  padding: 0 var(--space-2);
  border-top: 1px solid var(--border);
  background: var(--panel);
  font-size: var(--text-sm);
  font-variant-numeric: tabular-nums;

.status-group { display: flex; align-items: center; gap: 2px; }
.status-spacer { flex: 1; }
.status-sep { width: 1px; height: 16px; margin: 0 var(--space-1); background: var(--border); }
.statusbar .btn.icon-btn { width: 26px; height: 26px; }
.statusbar .input { height: 24px; font-size: var(--text-sm); text-align: center; }
.page-input { min-width: 4ch; margin: 0 2px; }
.page-total { color: var(--text-muted); margin-right: 2px; white-space: nowrap; }
.zoom-combo { display: flex; align-items: center; }
.zoom-input { width: 58px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.statusbar .zoom-menu-btn {

  border-radius: 0 var(--radius) var(--radius) 0;
}
.layout-btn { height: 26px; padding: 0 var(--space-2); gap: 6px; font-size: var(--text-sm); }

/* Menus */
.menu {
  position: fixed;
  z-index: 100;
  min-width: 200px;
  padding: var(--space-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);

.menu-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: 100%;
  height: var(--control-h-sm);
  padding: 0 var(--space-2) 0 4px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  text-align: left;

.menu-item:hover,
.menu-item:focus { background: var(--hover); box-shadow: none; }
.menu-item:focus-visible { background: var(--accent-soft); }
.menu-item[aria-disabled="true"] { opacity: .45; cursor: default; }
.menu-check { display: grid; place-items: center; width: 16px; color: var(--accent-text); }
.menu-icon-space { width: 16px; }
.menu-item .icon { color: var(--text-muted); }
.menu-label { flex: 1; white-space: nowrap; }
.menu-shortcut { color: var(--text-muted); font-size: var(--text-sm); }
.menu-hint { color: var(--text-muted); font-size: var(--text-xs); }
.menu-separator { height: 1px; margin: var(--space-1) 0; background: var(--border); }

/* Dialogs */
.dialog {
  width: min(440px, calc(100vw - 32px));
  padding: 0;
  border: 1px solid var(--border);

/* Viewer: scroll container, pages, layers, error tiles. */

.viewer-host {
  position: absolute;
  inset: 0;

  inset: 0;

/* Pages are paper: white in both themes. */
.page {
  position: absolute;
  overflow: hidden;
  background: #fff;
  box-shadow: var(--page-shadow);
  color-scheme: light;
  contain: strict;

  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}
.tile-layer { position: absolute; inset: 0; pointer-events: none; }

  inset: 0;

  place-items: center;
  color: #c9ced3;
  font-size: 15px;

  color: #7a1426;
  text-align: center;
  font-size: var(--text-md);
}
.page-error span { max-width: 32ch; color: #6b4b52; }

.textLayer { z-index: 1; }
.textLayer ::selection { background: rgba(183, 2, 40, .25); }

.linkLayer {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 2;
  transform-origin: 0 0;
  pointer-events: none;
}
.pdf-link {
  position: absolute;
  display: block;
  pointer-events: auto;
  border-radius: 2px;
}
.pdf-link:hover { background: rgba(0, 90, 200, .08); }
.pdf-link:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

/* Opening… overlay */
.loading {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;

}
@keyframes spin { to { transform: rotate(360deg); } }

  border-radius: 2px;
  background: var(--border);
  overflow: hidden;
}
.progress-fill { width: 0; height: 100%; background: var(--accent); transition: width var(--dur) var(--ease); }

/* Drag-and-drop */
.drop-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: var(--space-5);

  <script type="application/json" id="app-modules">{"@app/core/idb.js":"// Minimal IndexedDB helper. Every call fails soft: if storage is blocked\n// (private windows, disabled site data) the app keeps working without it.\n\nconst DB_NAME = 'pdf-editor';\nconst DB_VERSION = 1;\n\n// All object stores, created up front so later milestones don't need a\n// schema migration: recents (metadata + thumbnail), recentFiles (bytes),\n// autosave (M4), signatures (M9).\nconst STORES = {\n  recents: { keyPath: 'id' },\n  recentFiles: { keyPath: 'id' },\n  autosave: { keyPath: 'id' },\n  signatures: { keyPath: 'id' },\n};\n\nlet dbPromise = null;\n\nexport function openDb() {\n  if (!dbPromise) {\n    dbPromise = new Promise((resolve, reject) => {\n      let req;\n      try {\n        req = indexedDB.open(DB_NAME, DB_VERSION);\n      } catch (err) {\n        reject(err);\n        return;\n      }\n      req.onupgradeneeded = () => {\n        const db = req.result;\n        for (const [name, opts] of Object.entries(STORES)) {\n          if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, opts);\n        }\n      };\n      req.onsuccess = () => resolve(req.result);\n      req.onerror = () => reject(req.error);\n      req.onblocked = () => reject(new Error('IndexedDB upgrade blocked'));\n    }).catch((err) => {\n      dbPromise = null;\n      throw err;\n    });\n  }\n  return dbPromise;\n}\n\nfunction promisify(req) {\n  return new Promise((resolve, reject) => {\n    req.onsuccess = () => resolve(req.result);\n    req.onerror = () => reject(req.error);\n  });\n}\n\nasync function withStore(name, mode, fn) {\n  const db = await openDb();\n  const tx = db.transaction(name, mode);\n  const result = await fn(tx.objectStore(name));\n  await new Promise((resolve, reject) => {\n    tx.oncomplete = resolve;\n    tx.onerror = () => reject(tx.error);\n    tx.onabort = () => reject(tx.error ?? new Error('transaction aborted'));\n  });\n  return result;\n}\n\nexport const idb = {\n  get: (store, key) => withStore(store, 'readonly', (s) => promisify(s.get(key))),\n  getAll: (store) => withStore(store, 'readonly', (s) => promisify(s.getAll())),\n  put: (store, value) => withStore(store, 'readwrite', (s) => promisify(s.put(value))),\n  delete: (store, key) => withStore(store, 'readwrite', (s) => promisify(s.delete(key))),\n  clear: (store) => withStore(store, 'readwrite', (s) => promisify(s.clear())),\n};\n","@app/core/libs.config.js":"// Single source of truth for third-party library versions.\n//\n// Every library is loaded from jsDelivr at a pinned version. The end-to-end\n// tests read this file too: they serve the same paths from node_modules\n// (package.json devDependencies must carry the same versions — the test\n// harness fails loudly if they drift).\n//\n// Keep this file free of imports so Node can import it directly.\n\nexport const CDN_BASE = 'https://cdn.jsdelivr.net/npm';\n\nexport const LIBS = {\n  pdfjs: {\n    pkg: 'pdfjs-dist',\n    version: '6.5.438',\n    license: 'Apache-2.0',\n    homepage: 'https://mozilla.github.io/pdf.js/',\n    files: {\n      main: 'build/pdf.min.mjs',\n      worker: 'build/pdf.worker.min.mjs',\n      cmaps: 'cmaps/',\n      standardFonts: 'standard_fonts/',\n      wasm: 'wasm/',\n      iccs: 'iccs/',\n    },\n  },\n  pdfLib: {\n    pkg: 'pdf-lib',\n    version: '1.17.1',\n    license: 'MIT',\n    homepage: 'https://pdf-lib.js.org/',\n    files: {\n      main: 'dist/pdf-lib.esm.min.js',\n      umd: 'dist/pdf-lib.min.js',\n    },\n  },\n  fflate: {\n    pkg: 'fflate',\n    version: '0.8.3',\n    license: 'MIT',\n    homepage: 'https://github.com/101arrowz/fflate',\n    files: {\n      main: 'esm/browser.js',\n    },\n  },\n  tesseract: {\n    pkg: 'tesseract.js',\n    version: '7.0.0',\n    license: 'Apache-2.0',\n    homepage: 'https://tesseract.projectnaptha.com/',\n    files: {\n      main: 'dist/tesseract.esm.min.js',\n    },\n  },\n};\n\n/** Absolute CDN URL for a file of a pinned library. */\nexport function libUrl(name, file = 'main') {\n  const lib = LIBS[name];\n  if (!lib) throw new Error(`Unknown library: ${name}`);\n  const path = lib.files[file] ?? file;\n  return `${CDN_BASE}/${lib.pkg}@${lib.version}/${path}`;\n}\n","@app/core/libs.js":"// Lazy loaders for the CDN libraries. Each library is fetched at most once.\nimport { libUrl } from '@app/core/libs.config.js';\n\nconst cache = new Map();\n\nfunction once(key, loader) {\n  if (!cache.has(key)) {\n    const p = loader().catch((err) => {\n      cache.delete(key); // allow a retry after a network failure\n      throw err;\n    });\n    cache.set(key, p);\n  }\n  return cache.get(key);\n}\n\n/** pdf.js main module (the worker is wired up by the viewer, see view/). */\nexport function loadPdfjs() {\n  return once('pdfjs', () => import(libUrl('pdfjs')));\n}\n\n/** pdf-lib ES module (main thread use; heavy work runs in a worker later). */\nexport function loadPdfLib() {\n  return once('pdfLib', () => import(libUrl('pdfLib')));\n}\n\n/** fflate for zipping split outputs. */\nexport function loadFflate() {\n  return once('fflate', () => import(libUrl('fflate')));\n}\n","@app/core/prefs.js":"// Preferences in localStorage, namespaced and failure-tolerant\n// (private windows or blocked storage must never break the app).\nconst PREFIX = 'pdfeditor.';\n\nexport function getPref(key, fallback = null) {\n  try {\n    const raw = localStorage.getItem(PREFIX + key);\n    return raw === null ? fallback : JSON.parse(raw);\n  } catch {\n    return fallback;\n  }\n}\n\nexport function setPref(key, value) {\n  try {\n    localStorage.setItem(PREFIX + key, JSON.stringify(value));\n  } catch {\n    /* storage unavailable: keep working without persistence */\n  }\n}\n\nexport function removePref(key) {\n  try {\n    localStorage.removeItem(PREFIX + key);\n  } catch {\n    /* ignore */\n  }\n}\n","@app/core/recents.js":"// Recent files, kept in IndexedDB in this browser only. Metadata and a small\n// first-page thumbnail live in \"recents\"; the file bytes live separately in\n// \"recentFiles\" so listing recents never loads whole PDFs.\nimport { idb } from '@app/core/idb.js';\n\nexport const MAX_RECENTS = 12;\n/** Files larger than this are listed but not stored (re-open from disk). */\nexport const MAX_STORED_BYTES = 150 * 1024 * 1024;\n\nconst listeners = new Set();\nexport function onRecentsChange(fn) {\n  listeners.add(fn);\n  return () => listeners.delete(fn);\n}\nconst emit = () => listeners.forEach((fn) => fn());\n\n/** A stable id for a file's content (SHA-256, or a sampled hash fallback). */\nexport async function contentId(bytes) {\n  try {\n    const digest = await crypto.subtle.digest('SHA-256', bytes);\n    return [...new Uint8Array(digest).slice(0, 16)].map((b) => b.toString(16).padStart(2, '0')).join('');\n  } catch {\n    // FNV-1a over up to 64k sampled bytes + the length.\n    let h = 0x811c9dc5;\n    const step = Math.max(1, Math.floor(bytes.length / 65536));\n    for (let i = 0; i \u003c bytes.length; i += step) {\n      h ^= bytes[i];\n      h = Math.imul(h, 0x01000193);\n    }\n    return `f${(h >>> 0).toString(16)}-${bytes.length.toString(16)}`;\n  }\n}\n\nexport async function listRecents() {\n  try {\n    const all = await idb.getAll('recents');\n    return all.sort((a, b) => b.lastOpened - a.lastOpened);\n  } catch {\n    return [];\n  }\n}\n\n/**\n * Remember a file. `thumbnail` is an optional image Blob.\n * Returns false if storage isn't available.\n */\nexport async function addRecent({ id, name, bytes, pageCount, thumbnail = null }) {\n  try {\n    const stored = bytes.length \u003c= MAX_STORED_BYTES;\n    const existing = await idb.get('recents', id);\n    await idb.put('recents', {\n      id,\n      name,\n      size: bytes.length,\n      pageCount,\n      lastOpened: Date.now(),\n      stored,\n      thumbnail: thumbnail ?? existing?.thumbnail ?? null,\n    });\n    if (stored) await idb.put('recentFiles', { id, bytes: new Blob([bytes], { type: 'application/pdf' }) });\n    await prune();\n    emit();\n    return true;\n  } catch {\n    return false;\n  }\n}\n\nexport async function setRecentThumbnail(id, thumbnail) {\n  try {\n    const rec = await idb.get('recents', id);\n    if (!rec) return;\n    rec.thumbnail = thumbnail;\n    await idb.put('recents', rec);\n    emit();\n  } catch {\n    /* ignore */\n  }\n}\n\n/** The stored bytes of a recent file, or null. */\nexport async function getRecentBytes(id) {\n  try {\n    const rec = await idb.get('recentFiles', id);\n    if (!rec) return null;\n    return new Uint8Array(await rec.bytes.arrayBuffer());\n  } catch {\n    return null;\n  }\n}\n\nexport async function removeRecent(id) {\n  try {\n    await idb.delete('recents', id);\n    await idb.delete('recentFiles', id);\n  } finally {\n    emit();\n  }\n}\n\nexport async function clearRecents() {\n  try {\n    await idb.clear('recents');\n    await idb.clear('recentFiles');\n  } finally {\n    emit();\n  }\n}\n\nasync function prune() {\n  const all = await listRecents();\n  for (const old of all.slice(MAX_RECENTS)) {\n    await idb.delete('recents', old.id);\n    await idb.delete('recentFiles', old.id);\n  }\n}\n","@app/core/settings.js":"// User preferences (Preferences dialog) and the window arrangement (panel\n// sizes/visibility), persisted in localStorage via prefs.js.\nimport { getPref, setPref, removePref } from '@app/core/prefs.js';\n\nexport const SETTING_DEFAULTS = {\n  toolsSide: 'left', // 'left' | 'right'\n  author: '', // name used on comments\n  defaultZoom: 'auto', // 'auto' | 'fit-width' | 'fit-page' | number\n  defaultLayout: 'continuous', // 'continuous' | 'single' | 'two-up' | 'two-up-cover'\n};\n\nexport const ARRANGEMENT_DEFAULTS = {\n  tools: { visible: true, width: 260 },\n  side: { visible: false, width: 320, panel: 'pages' },\n};\n\nexport const TOOLS_WIDTH = { min: 240, max: 520 };\nexport const SIDE_WIDTH = { min: 260, max: 520 };\n\nconst listeners = new Set();\nexport function onSettingsChange(fn) {\n  listeners.add(fn);\n  return () => listeners.delete(fn);\n}\nconst emit = (key) => listeners.forEach((fn) => fn(key));\n\nexport function getSetting(key) {\n  return getPref(`setting.${key}`, SETTING_DEFAULTS[key]);\n}\n\nexport function setSetting(key, value) {\n  if (value === SETTING_DEFAULTS[key]) removePref(`setting.${key}`);\n  else setPref(`setting.${key}`, value);\n  emit(key);\n}\n\nexport function getArrangement() {\n  const saved = getPref('arrangement', null) ?? {};\n  const clamp = (v, { min, max }, d) => (Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : d);\n  const tools = { ...ARRANGEMENT_DEFAULTS.tools, ...saved.tools };\n  const side = { ...ARRANGEMENT_DEFAULTS.side, ...saved.side };\n  tools.width = clamp(tools.width, TOOLS_WIDTH, ARRANGEMENT_DEFAULTS.tools.width);\n  side.width = clamp(side.width, SIDE_WIDTH, ARRANGEMENT_DEFAULTS.side.width);\n  return { tools, side };\n}\n\nexport function saveArrangement(arrangement) {\n  setPref('arrangement', arrangement);\n  emit('arrangement');\n}\n\nexport function resetArrangement() {\n  removePref('arrangement');\n  emit('arrangement');\n  return getArrangement();\n}\n\n/** The author name for comments (falls back to \"Anonymous\" in the UI). */\nexport function authorName() {\n  return getSetting('author').trim();\n}\n","@app/core/version.js":"// The app version. build.mjs checks it matches package.json.\nexport const VERSION = '0.1.0';\n","@app/i18n/en.js":"// English strings. Keys are grouped by area. Placeholders use {name}.\nexport const en = {\n  // App\n  'app.name': 'PDF Editor',\n  'app.loading': 'Loading…',\n  'app.loadError': 'PDF Editor could not start: {message}',\n  'app.privacy': 'Your files never leave this device',\n  'app.privacyDetail': 'Everything runs locally in your browser. The only network requests are library downloads from a public CDN.',\n\n  // Top bar\n  'topbar.theme.toLight': 'Switch to light theme',\n  'topbar.theme.toDark': 'Switch onfig.js';\nimport { VERSION } from '@app/core/version.js';\n\nfunction start() {\n  setLocale('en');\n  initTheme();\n  registerCatalogue();\n  registerReadMode();\n\n  const root = document.getElementById('app');\n  const app = new App(root);\n\n  root.removeAttribute('aria-busy');\n  document.documentElement.dataset.ready = 'true';\n\n  // A small, stable handle for diagnostics and end-to-end tests.\n  window.pdfEditor = Object.freeze({ version: VERSION, app, registry, commands, libs, libsConfig: LIBS });\n}\n\nstart();\n","@app/tools/catalogue.js":"// The complete tool catalogue. Every planned tool is defined here as\n// \"Coming soon\"; each tool's module calls implementTool() when it's built.\nimport { defineTool } from '@app/tools/registry.js';\n\nconst CATALOGUE = [\n  // Read\n  { id: 'read-mode', category: 'read', icon: 'bookOpen', milestone: 'M1' },\n  { id: 'comment', category: 'read', icon: 'messageSquare', milestone: 'M8' },\n  { id: 'highlight', category: 'read', icon: 'highlighter', milestone: 'M8' },\n  { id: 'draw', category: 'read', icon: 'pen', milestone: 'M8' },\n\n  // Find\n  { id: 'find', category: 'find', icon: 'search', shortcut: 'Mod+F', milestone: 'M3' },\n  { id: 'bookmarks', category: 'find', icon: 'bookmark', milestone: 'M3' },\n  { id: 'page-thumbnails', category: 'find', icon: 'grid', milestone: 'M3' },\n\n  // Organize\n  { id: 'organize-pages', category: 'organize', icon: 'layoutPages', milestone: 'M5' },\n  { id: 'rotate-pages', category: 'organize', icon: 'rotateCw', milestone: 'M5' },\n  { id: 'insert-pages', category: 'organize', icon: 'filePlus', milestone: 'M5' },\n  { id: 'delete-pages', category: 'organize', icon: 'trash', milestone: 'M5' },\n  { id: 'extract-pages', category: 'organize', icon: 'fileOutput', milestone: 'M6' },\n\n  // Combine & split\n  { id: 'combine-files', category: 'combine', icon: 'files', milestone: 'M6' },\n  { id: 'split-document', category: 'combine', icon: 'scissors', milestone: 'M6' },\n\n  // Protect\n  { id: 'redact', category: 'protect', icon: 'redact', milestone: 'M10' },\n  { id: 'sanitize', category: 'protect', icon: 'shieldCheck', milestone: 'M10' },\n  { id: 'protect-password', category: 'protect', icon: 'lock', milestone: 'M10' },\n\n  // Forms & layers\n  { id: 'fill-form', category: 'forms', icon: 'textInput', milestone: 'M9' },\n  { id: 'add-signature', category: 'forms', icon: 'signature', milestone: 'M9' },\n  { id: 'prepare-form', category: 'forms', icon: 'squarePlus', milestone: 'M9' },\n  { id: 'flatten-form', category: 'forms', icon: 'stamp', milestone: 'M9' },\n  { id: 'layers', category: 'forms', icon: 'layers', milestone: 'M7' },\n\n  // Scan & OCR\n  { id: 'ocr', category: 'ocr', icon: 'scanText', milestone: 'M11' },\n\n  // Everywhere\n  { id: 'print', category: 'everywhere', icon: 'printer', shortcut: 'Mod+P', milestone: 'M10' },\n  { id: 'properties', category: 'everywhere', icon: 'info', milestone: 'M7' },\n  { id: 'attachments', category: 'everywhere', icon: 'paperclip', milestone: 'M7' },\n  { id: 'accessibility-check', category: 'everywhere', icon: 'accessibility', milestone: 'M12' },\n  { id: 'undo-history', category: 'everywhere', icon: 'history', milestone: 'M4' },\n];\n\n/** Tools featured on the home screen. */\nexport const RECOMMENDED = [\n  'organize-pages',\n  'combine-files',\n  'comment',\n  'fill-form',\n  'redact',\n  'ocr',\n];\n\nexport function registerCatalogue() {\n  for (const def of CATALOGUE) defineTool(def);\n}\n","@app/tools/read-mode.js":"// Read mode: hide all chrome and show only the pages. Esc exits.\nimport { implementTool } from '@app/tools/registry.js';\n\nexport function registerReadMode() {\n  implementTool('read-mode', ({ app }) => app.toggleReadMode());\n}\n","@app/tools/registry.js":"// Central tool registry.\n//\n// Every tool is *defined* up front in catalogue.js (metadata, status \"soon\")\n// so the catalogue is complete from day one. A tool's own module later calls\n// implementTool(id, run) which flips its status to \"ready\". The UI (tools\n// panel, home catalogue, command palette) reads only from this registry.\n\nexport const CATEGORIES = [\n  'read',\n  'find',\n  'organize',\n  'combine',\n  'protect',\n  'forms',\n  'ocr',\n  'everywhere',\n];\n\nconst tools = new Map();\nconst listeners = new Set();\n\n/**\n * @typedef {Object} ToolDef\n * @property {string} id          kebab-case id, unique\n * @property {string} label       i18n key for the visible name\n * @property {string} description i18n key for the one-line description\n * @property {string} category    one of CATEGORIES\n * @property {string} icon        icon name from ui/icons.js\n * @property {string} [shortcut]  e.g. \"Mod+F\" (Mod = ⌘ on macOS, Ctrl elsewhere)\n * @property {string} milestone   the milestone that builds it, e.g. \"M5\"\n * @property {'ready'|'soon'} status\n * @property {(ctx: object) => any} [run]\n */\n\nexport function defineTool(def) {\n  if (!/^[a-z][a-z0-9-]*$/.test(def.id)) throw new Error(`Bad tool id: ${def.id}`);\n  if (tools.has(def.id)) throw new Error(`Tool defined twice: ${def.id}`);\n  if (!CATEGORIES.includes(def.category)) {\n    throw new Error(`Tool ${def.id} has unknown category: ${def.category}`);\n  }\n  const tool = {\n    label: `tool.${def.id}.label`,\n    description: `tool.${def.id}.desc`,\n    shortcut: null,\n    ...def,\n    status: 'soon',\n    run: null,\n  };\n  tools.set(tool.id, tool);\n  emit();\n  return tool;\n}\n\n/** Called by a tool's own module once it is built. */\nexport function implementTool(id, run) {\n  const tool = tools.get(id);\n  if (!tool) throw new Error(`implementTool: unknown tool ${id}`);\n  if (typeof run !== 'function') throw new Error(`implementTool: ${id} needs a run()`);\n  tool.run = run;\n  tool.status = 'ready';\n  emit();\n  return tool;\n}\n\nexport function getTool(id) {\n  return tools.get(id) ?? null;\n}\n\nexport function listTools({ category, status } = {}) {\n  return [...tools.values()].fi ().goToPage(1) });\n  def({ id: 'go.lastPage', label: 'command.go.lastPage', enabled: hasDoc, run: () => v().goToPage(v().numPages) });\n  def({ id: 'go.nextPage', label: 'status.nextPage', icon: 'chevronRight', enabled: hasDoc, run: () => v().next() });\n  def({ id: 'go.prevPage', label: 'status.prevPage', icon: 'chevronLeft', enabled: hasDoc, run: () => v().prev() });\n\n  // App / help\n  def({ id: 'app.palette', label: 'command.app.palette', icon: 'search', shortcut: 'Mod+K', hidden: true, run: () => app.openPalette() });\n  def({ id: 'app.preferences', label: 'command.app.preferences', icon: 'settings', shortcut: 'Mod+,', run: () => openPreferences() });\n  def({ id: 'app.allTools', label: 'command.app.allTools', icon: 'grid', run: () => {\n    app.activate(null);\n    document.querySelector('.catalogue')?.scrollIntoView({ block: 'start' });\n  } });\n  def({ id: 'help.shortcuts', label: 'command.help.shortcuts', icon: 'keyboard', shortcut: 'Mod+/', run: () => openShortcuts() });\n  def({ id: 'help.about', label: 'command.help.about', icon: 'info', run: () => openAbout() });\n}\n","@app/ui/app-menus.js":"// Menu bar contents, built from commands each time a menu opens.\nimport { t } from '@app/i18n/index.js';\nimport { getCommand, primaryShortcut } from '@app/ui/commands.js';\nimport { listTools } from '@app/tools/registry.js';\n\nfunction item(id, { role = 'menuitem', icon: withIcon = true } = {}) {\n  const c = getCommand(id);\n  return {\n    id,\n    label: t(c.label),\n    icon: withIcon ? c.icon : undefined,\n    shortcut: primaryShortcut(id),\n    role,\n    checked: c.checked ? c.checked() : undefined,\n    disabled: !c.enabled(),\n    run: () => c.run(),\n  };\n}\n\nexport function buildMenus(app) {\n  return [\n    {\n      id: 'file',\n      label: t('menu.file'),\n      items: () => [\n        item('file.open'),\n        'separator',\n        item('tab.close'),\n        item('tab.closeOthers'),\n        item('tab.reopen'),\n        'separator',\n        item('app.home'),\n        item('app.preferences'),\n      ],\n    },\n    {\n      id: 'edit',\n      label: t('menu.edit'),\n      items: () => [item('edit.copy'), item('edit.selectPageText')],\n    },\n    {\n      id: 'view',\n      label: t('menu.view'),\n      items: () => [\n        item('view.zoomIn'),\n        item('view.zoomOut'),\n        item('view.actualSize'),\n        item('view.fitWidth', { role: 'menuitemradio' }),\n        item('view.fitPage', { role: 'menuitemradio' }),\n        'separator',\n        item('view.layout.continuous', { role: 'menuitemradio' }),\n        item('view.layout.single', { role: 'menuitemradio' }),\n        item('view.layout.twoUp', { role: 'menuitemradio' }),\n        item('view.layout.twoUpCover', { role: 'menuitemradio' }),\n        'separator',\n        item('view.rotateLeft'),\n        item('view.rotateRight'),\n        'separator',\n        item('view.toggleToolsPanel', { role: 'menuitemcheckbox', icon: false }),\n        item('view.toggleSidePanel', { role: 'menuitemcheckbox', icon: false }),\n        item('view.resetArrangement'),\n        'separator',\n        item('view.toggleTheme'),\n        item('view.fullscreen'),\n        item('view.readMode'),\n      ],\n    },\n    {\n      id: 'tools',\n      label: t('menu.tools'),\n      items: () => [\n        { id: 'app.palette', label: t('command.app.palette'), icon: 'search', shortcut: primaryShortcut('app.palette'), run: () => app.openPalette() },\n        'separator',\n        ...listTools({ status: 'ready' }).map((tool) => ({\n          id: `tool-${tool.id}`,\n          label: t(tool.label),\n          icon: tool.icon,\n          shortcut: tool.shortcut ?? undefined,\n          run: () => app.useTool(tool.id),\n        })),\n        'separator',\n        item('app.allTools'),\n      ],\n    },\n    {\n      id: 'help',\n      label: t('menu.help'),\n      items: () => [item('help.shortcuts'), 'separator', item('help.about')],\n    },\n  ];\n}\n","@app/ui/app.js":"// The application controller: tabs of open documents, the shell (menus,\n// tools panel, side panel, status bar), commands, recents, drag-and-drop,\n// Read mode and full screen.\nimport { h } from '@app/ui/dom.js';\nimport { icon } from '@app/ui/icons.js';\nimport { t } from '@app/i18n/index.js';\nimport { createShell } from '@app/ui/shell.js';\nimport { createHome } from '@app/ui/home.js';\nimport { createTabStrip } from '@app/ui/tabs.js';\nimport { createMenubar } from '@app/ui/menubar.js';\nimport { createToolsPanel } from '@app/ui/tools-panel.js';\nimport { createSidePanel } from '@app/ui/side-panel.js';\nimport { buildMenus } from '@app/ui/app-menus.js';\nimport { registerAppCommands } from '@app/ui/app-commands.js';\nimport { openMenu, isMenuOpen } from '@app/ui/menu.js';\nimport { openPalette } from '@app/ui/palette.js';\nimport { toast } from '@app/ui/toast.js';\nimport { alertDialog, confirmDialog, promptPassword } from '@app/ui/dialog.js';\nimport { handleShortcut, listCommands, primaryShortcut } from '@app/ui/commands.js';\nimport { DocTab } from '@app/ui/doc-tab.js';\nimport { getPdfjs, openPdf, isPasswordCancel } from '@app/view/pdfjs.js';\nimport { runTool, getTool, listTools } from '@app/tools/registry.js';\nimport { getSetting, getArrangement, saveArrangement, resetArrangement, onSettingsChange } from '@app/core/settings.js';\nimport { contentId, addRecent, setRecentThumbnail, getRecentBytes, removeRecent, clearRecents } from '@app/core/recents.js';\n\nconst LOADING_DELAY = 150;\nconst MAX_CLOSED = 10;\nconst THUMB_WIDTH = 180;\n\nexport class App extends EventTarget {\n  constructor(root) {\n    super();\n    this.root = root;\n    this.tabs = [];\n    this.activeTab = null; // null = Home\n    this.closedTabs = [];\n    this.readMode = false;\n    this.arrangement = getArrangement();\n\n    this.shell = createShell(root, { onPalette: () => this.openPalette() });\n    this.home = createHome(this.shell.main, {\n      onOpen: () => this.pickFile(),\n      onTool: (id) => this.useTool(id),\n      onOpenRecent: (rec) => this.openRecent(rec),\n      onRemoveRecent: (rec) => removeRecent(rec.id),\n      onClearRecents: () => this.clearRecents(),\n    });\n\n    this.tabStrip = createTabStrip({\n      onActivate: (id) => this.activate(id ? this.tabs.find((tab) => tab.id === id) : null),\n      onClose: (id) => this.closeTab(this.tabs.find((tab) => tab.id === id)),\n      onContextMenu: (id, at, anchor) => this.tabContextMenu(this.tabs.find((tab) => tab.id === id), at, anchor),\n      onOpen: () => this.pickFile(),\n    });\n    this.shell.tabsSlot.append(this.tabStrip.el);\n\n    this.toolsPanel = createToolsPanel({\n      onTool: (id) => this.useTool(id),\n      getState: () => this.arrangement.tools,\n      setState: (patch) => this.updateArrangement('tools', patch),\n      side: () => getSetting('toolsSide'),\n    });\n    this.sidePanel = createSidePanel({\n      getTab: () => this.activeTab,\n      getState: () => this.arrangement.side,\n      setState: (patch) => this.updateArrangement('side', patch),\n    });\n    this.toolsPanel.splitter.classList.add('tools-splitter');\n    this.sidePanel.splitter.classList.add('side-splitter');\n    const ws = this.shell.workspace;\n    ws.prepend(this.toolsPanel.panel, this.toolsPanel.splitter);\n    ws.append(this.sidePanel.splitter, this.sidePanel.panel, this.sidePanel.rail);\n\n    this.fileInput = h('input', {\n      type: 'file',\n      id: 'file-input',\n      accept: 'application/pdf,.pdf',\n      multiple: true,\n      hidden: true,\n      tabindex: '-1',\n    });\n    this.fileInput.addEventListener('change', async () => {\n      const files = [...(this.fileInput.files ?? [])];\n      this.fileInput.value = '';\n      for (const file of files) await this.openFile(file);\n    });\n    root.append(this.fileInput);\n\n    registerAppCommands(this);\n    this.menubar = createMenubar(buildMenus(this), { label: t('menu.label') });\n    this.shell.menubarSlot.append(this.menubar.el);\n\n    this.applySettings();\n    onSettingsChange((key) => {\n      if (key === 'toolsSide') this.applySettings();\n    });\n    this.applyArrangement();\n    this.renderTabs();\n    this.bindKeys();\n    this.bindDragAndDrop();\n  }\n\n  get viewer() {\n    return this.activeTab?.viewer ?? null;\n  }\n\n  // ------------------------------------------------------- arrangement\n\n  applySettings() {\n    this.shell.setToolsSide(getSetting('toolsSide'));\n  }\n\n  applyArrangement() {\n    this.toolsPanel.render();\n    this.sidePanel.render();\n  }\n\n  updateArrangement(which, patch) {\n    this.arrangement = { ...this.arrangement, [which]: { ...this.arrangement[which], ...patch } };\n    saveArrangement(this.arrangement);\n    this.applyArrangement();\n  }\n\n  toggleToolsPanel() {\n    this.updateArrangement('tools', { visible: !this.arrangement.tools.visible });\n  }\n\n  toggleSidePanel() {\n    this.updateArrangement('side', { visible: !this.arrangement.side.visible });\n  }\n\n  showPanel(id) {\n    this.updateArrangement('side', { visible: true, panel: id });\n  }\n\n  resetArrangement() {\n    this.arrangement = resetArrangement();\n    this.applyArrangement();\n    toast(t('arrangement.reset'));\n  }\n\n  // -------------------------------------------------------------- tabs\n\n  renderTabs() {\n    this.tabStrip.render(this.tabs, this.activeTab?.id ?? null);\n  }\n\n  /** Show a tab, or the Home screen when tab is null. */\n  activate(tab) {\n    if (tab === this.activeTab && (tab || !this.home.hidden)) return;\n    this.activeTab?.hide();\n    this.activeTab = tab ?? null;\n    this.home.hidden = !!tab;\n    if (tab) {\n      tab.show();\n      this.shell.setStatusBar(tab.statusbar.el);\n      document.title = `${tab.name} — ${t('app.name')}`;\n      tab.viewer.focus();\n    } else {\n      this.exitReadMode();\n      this.shell.setStatusBar(null);\n      document.title = t('app.name');\n    }\n    this.renderTabs();\n    this.sidePanel.render();\n    this.dispatchEvent(new CustomEvent('tabchange'));\n  }\n\n  nextTab(dir) {\n    if (!this.tabs.length) return;\n    const i = this.activeTab ? this.tabs.indexOf(this.activeTab) : -1;\n    this.activate(this.tabs[(i + dir + this.tabs.length) % this.tabs.length]);\n  }\n\n  async closeTab(tab, { force = false } = {}) {\n    if (!tab) return false;\n    if (tab.dirty && !force) {\n      const ok = await confirmDialog({\n        title: t('close.dirty.title', { name: tab.name }),\n        message: t('close.dirty.message'),\n        confirmLabel: t('close.dirty.discard'),\n        danger: true,\n      });\n      if (!ok) return false;\n    }\n    const index = this.tabs.indexOf(tab);\n    this.closedTabs.push({\n      name: tab.name,\n      bytes: tab.bytes,\n      password: tab.password,\n      view: tab.viewState(),\n    });\n    if (this.closedTabs.length > MAX_CLOSED) this.closedTabs.shift();\n    this.tabs.splice(index, 1);\n    if (this.activeTab === tab) {\n      this.activeTab = null;\n      this.activate(this.tabs[Math.min(index, this.tabs.length - 1)] ?? null);\n    }\n    tab.destroy();\n    this.renderTabs();\n    this.dispatchEvent(new CustomEvent('tabclosed'));\n    return true;\n  }\n\n  async closeOtherTabs(keep) {\n    for (const tab of [...this.tabs]) {\n      if (tab !== keep) await this.closeTab(tab);\n    }\n    if (keep) this.activate(keep);\n  }\n\n  async reopenClosedTab() {\n    const last = this.closedTabs.pop();\n    if (!last) return null;\n    return this.openBytes(last.bytes, last.name, { password: last.password, view: last.view });\n  }\n\n  tabContextMenu(tab, at, anchor) {\n    if (!tab) return;\n    openMenu(anchor, [\n      { id: 'tab-close', label: t('tabs.close'), shortcut: primaryShortcut('tab.close'), run: () => this.closeTab(tab) },\n      { id: 'tab-close-others', label: t('tabs.closeOthers'), disabled: this.tabs.length \u003c 2, run: () => this.closeOtherTabs(tab) },\n      'separator',\n      { id: 'tab-reopen', label: t('tabs.reopen'), shortcut: primaryShortcut('tab.reopen'), disabled: !this.closedTabs.length, run: () => this.reopenClosedTab() },\n    ], { at, label: tab.name });\n  }\n\n  // ------------------------------------------------------------ opening\n\n  pickFile() {\n    this.fileInput.click();\n  }\n\n  async openFile(file) {\n    let bytes;\n    try {\n      bytes = new Uint8Array(await file.arrayBuffer());\n    } catch (err) {\n      this.showOpenError(file.name, err);\n      return null;\n    }\n    return this.openBytes(bytes, file.name);\n  }\n\n  async openRecent(rec) {\n    const bytes = rec.stored ? await getRecentBytes(rec.id) : null;\n    if (!bytes) {\n      toast(t('home.recents.missing', { name: rec.name }));\n      this.pickFile();\n      return null;\n    }\n    return this.openBytes(bytes, rec.name);\n  }\n\n  async clearRecents() {\n    const ok = await confirmDialog({\n      title: t('home.recents.clearTitle'),\n      message: t('home.recents.clearMessage'),\n      confirmLabel: t('home.recents.clear'),\n      danger: true,\n    });\n    if (ok) await clearRecents();\n  }\n\n  defaultView() {\n    const layout = getSetting('defaultLayout');\n    return {\n      zoom: getSetting('defaultZoom'),\n      mode: layout === 'two-up-cover' ? 'two-up' : layout,\n      cover: layout === 'two-up-cover',\n      rotation: 0,\n    };\n  }\n\n  /**\n   * Open PDF bytes in a new tab (or switch to the tab that already has them).\n   * @param {Uint8Array} bytes\n   * @param {string} name\n   * @param {{ password?: string, view?: object }} [o]\n   */\n  async openBytes(bytes, name, { password = null, view = null } = {}) {\n    const id = await contentId(bytes);\n    const existing = this.tabs.find((tab) => tab.contentId === id);\n    if (existing) {\n      this.activate(existing);\n      return existing;\n    }\n\n    const loading = this.showLoading(name);\n    let result;\n    try {\n      result = await openPdf(bytes, {\n        password,\n        askPassword: (retry) => {\n          loading.pause();\n          return promptPassword({ filename: name, retry }).finally(() => loading.resume());\n        },\n        onProgress: (f) => loading.progress(f),\n      });\n    } catch (err) {\n      loading.done();\n      if (!isPasswordCancel(err)) this.showOpenError(name, err);\n      return null;\n    }\n    const pdfjs = await getPdfjs();\n    loading.done();\n\n    const tab = new DocTab({\n      name,\n      bytes,\n      contentId: id,\n      pdf: result.doc,\n      pdfjs,\n      password: result.password,\n      view: view ?? this.defaultView(),\n    });\n    tab.viewer.addEventListener('externallink', (e) => this.openExternalLink(e.detail.url));\n    tab.addEventListener('dirtychange', () => this.renderTabs());\n    this.tabs.push(tab);\n    this.shell.main.append(tab.host);\n    this.activate(tab);\n    await tab.init();\n    this.rememberRecent(tab);\n    this.dispatchEvent(new CustomEvent('documentopened', { detail: { name, tab } }));\n    return tab;\n  }\n\n  /** Save to recents, then add a first-page thumbnail in the background. */\n  async rememberRecent(tab) {\n    const ok = await addRecent({ id: tab.contentId, name: tab.name, bytes: tab.bytes, pageCount: tab.pdf.numPages });\n    if (!ok) return;\n    try {\n      const page = await tab.pdf.getPage(1);\n      const vp1 = page.getViewport({ scale: 1 });\n      const viewport = page.getViewport({ scale: THUMB_WIDTH / vp1.width });\n      const canvas = document.createElement('canvas');\n      canvas.width = Math.round(viewport.width);\n      canvas.height = Math.round(viewport.height);\n      await page.render({ canvas, viewport }).promise;\n      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));\n      canvas.width = 0;\n      if (blob) await setRecentThumbnail(tab.contentId, blob);\n    } catch {\n      /* no thumbnail: the card shows a generic icon */\n    }\n  }\n\n  showOpenError(name, err) {\n    let message;\n    if (err?.name === 'InvalidPDFException') message = t('open.error.invalid');\n    else if (err?.name === 'MissingPDFException') message = t('open.error.missing');\n    else if (/fetch|import|load|network/i.test(err?.message ?? '') && !navigator.onLine) message = t('open.error.offline');\n    else message = t('open.error.generic', { message: err?.message ?? String(err) });\n    alertDialog({ title: t('open.error.title', { name }), message });\n  }\n\n  showLoading(name) {\n    const bar = h('div.progress-bar', h('div.progress-fill'));\n    const el = h('div.loading', { role: 'status', 'aria-live': 'polite' },\n      h('div.spinner', { 'aria-hidden': 'true' }),\n      h('span', t('open.loading', { name })),\n      bar,\n    );\n    let shown = false;\n    const timer = setTimeout(() => {\n      shown = true;\n      this.shell.main.append(el);\n    }, LOADING_DELAY);\n    return {\n      progress: (f) => bar.firstChild.style.setProperty('width', `${Math.round(f * 100)}%`),\n      pause: () => { el.hidden = true; },\n      resume: () => { el.hidden = false; },\n      done: () => {\n        clearTimeout(timer);\n        if (shown) el.remove();\n      },\n    };\n  }\n\n  async openExternalLink(url) {\n    let parsed;\n    try {\n      parsed = new URL(url);\n    } catch {\n      return;\n    }\n    if (!['http:', 'https:', 'mailto:'].includes(parsed.protocol)) {\n      alertDialog({ title: t('link.title'), message: t('link.unsupported', { url }) });\n      return;\n    }\n    const ok = await confirmDialog({\n      title: t('link.title'),\n      message: [h('p', t('link.message')), h('p.link-url', url)],\n      confirmLabel: t('link.open'),\n    });\n    if (ok) window.open(parsed.href, '_blank', 'noopener,noreferrer');\n  }\n\n  // --------------------------------------------- read mode / full screen\n\n  toggleReadMode() {\n    if (this.readMode) this.exitReadMode();\n    else this.enterReadMode();\n  }\n\n  enterReadMode() {\n    if (!this.activeTab) {\n      toast(t('readMode.needsDocument'));\n      return;\n    }\n    if (this.readMode) return;\n    this.readMode = true;\n    document.documentElement.classList.add('read-mode');\n    const exit = h('button.btn.read-mode-exit', { type: 'button', onclick: () => this.exitReadMode() },\n      icon('x', { size: 14 }), t('readMode.exit'));\n    this.readModeExit = exit;\n    document.body.append(exit);\n    toast(t('readMode.hint'), { timeout: 2500 });\n    this.viewer?.focus();\n  }\n\n  exitReadMode() {\n    if (!this.readMode) return;\n    this.readMode = false;\n    document.documentElement.classList.remove('read-mode');\n    this.readModeExit?.remove();\n    this.viewer?.focus();\n  }\n\n  async toggleFullscreen() {\n    try {\n      if (document.fullscreenElement) await document.exitFullscreen();\n      else await document.documentElement.requestFullscreen();\n    } catch {\n      toast(t('fullscreen.unavailable'), { kind: 'error' });\n    }\n  }\n\n  // ------------------------------------------------------ tools/palette\n\n  async useTool(id) {\n    const tool = getTool(id);\n    if (!tool) return;\n    if (tool.status !== 'ready') {\n      toast(t('status.soonToast', { name: t(tool.label) }));\n      return;\n    }\n    await runTool(id, { app: this });\n  }\n\n  paletteItems() {\n    const commands = listCommands()\n      .filter((c) => !c.hidden)\n      .map((c) => ({\n        id: c.id,\n        label: t(c.label),\n        group: t(`menu.${c.id.split('.')[0]}`),\n        icon: c.icon,\n        shortcut: primaryShortcut(c.id),\n        disabled: !c.enabled(),\n        run: () => c.run(),\n      }));\n    const tools = listTools().map((tool) => ({\n      id: `tool:${tool.id}`,\n      label: t(tool.label),\n      group: t('palette.tool'),\n      icon: tool.icon,\n      shortcut: tool.shortcut,\n      hint: tool.status === 'ready' ? null : t('status.soon'),\n      run: () => this.useTool(tool.id),\n    }));\n    return [...commands, ...tools];\n  }\n\n  openPalette() {\n    openPalette(() => this.paletteItems());\n  }\n\n  // ------------------------------------------------------- input wiring\n\n  bindKeys() {\n    // Show the big viewer focus ring only while navigating by keyboard.\n    const root = document.documentElement;\n    document.addEventListener('keydown', (e) => {\n      if (e.key === 'Tab') root.classList.add('kbd-nav');\n    }, true);\n    document.addEventListener('pointerdown', () => root.classList.remove('kbd-nav'), true);\n    document.addEventListener('keydown', (e) => {\n      if (e.defaultPrevented) return;\n      if (document.querySelector('dialog[open]') || isMenuOpen()) return;\n      handleShortcut(e);\n    });\n  }\n\n  bindDragAndDrop() {\n    const overlay = h('div.drop-overlay', { hidden: true, 'aria-hidden': 'true' },\n      h('div.drop-overlay-inner', icon('upload', { size: 32 }), h('span', t('drop.overlay'))));\n    document.body.append(overlay);\n    let depth = 0;\n    const hasFiles = (e) => [...(e.dataTransfer?.types ?? [])].includes('Files');\n    window.addEventListener('dragenter', (e) => {\n      if (!hasFiles(e)) return;\n      e.preventDefault();\n      depth++;\n      overlay.hidden = false;\n    });\n    window.addEventListener('dragover', (e) => {\n      if (!hasFiles(e)) return;\n      e.preventDefault();\n      e.dataTransfer.dropEffect = 'copy';\n    });\n    window.addEventListener('dragleave', (e) => {\n      if (!hasFiles(e)) return;\n      depth = Math.max(0, depth - 1);\n      if (depth === 0) overlay.hidden = true;\n    });\n    window.addEventListener('drop', async (e) => {\n      if (!hasFiles(e)) return;\n      e.preventDefault();\n      depth = 0;\n      overlay.hidden = true;\n      const files = [...e.dataTransfer.files];\n      const pdfs = files.filter((f) => f.type === 'application/pdf' || /\\.pdf$/i.test(f.name));\n      for (const file of pdfs.length ? pdfs : files.slice(0, 1)) await this.openFile(file);\n    });\n  }\n}\n","@app/ui/commands.js":"// Command registry: every user action with a label, optional shortcut(s) and\n// an enabled() check. Keyboard shortcuts, menus (M2) and the command palette\n// (M2) all go through here.\nimport { matchShortcut } from '@app/ui/keys.js';\n\nconst commands = new Map();\n\n/**\n * @param {object} c\n * @param {string} c.id\n * @param {string} c.label        i18n key\n * @param {string|string[]} [c.shortcut]   first one is shown in the UI\n * @param {string} [c.icon]\n * @param {() => boolean} [c.enabled]\n * @param {() => boolean} [c.checked]\n * @param {(...args) => any} c.run\n */\nexport function defineCommand(c) {\n  if (commands.has(c.id)) throw new Error(`Command defined twice: ${c.id}`);\n  commands.set(c.id, { enabled: () => true, ...c });\n}\n\nexport function getCommand(id) {\n  return commands.get(id) ?? null;\n}\n\nexport function listCommands() {\n  return [...commands.values()];\n}\n\nexport function isEnabled(id) {\n  const c = commands.get(id);\n  return !!c && c.enabled();\n}\n\nexport function runCommand(id, ...args) {\n  const c = commands.get(id);\n  if (!c) throw new Error(`Unknown command: ${id}`);\n  if (!c.enabled()) return false;\n  c.run(...args);\n  return true;\n}\n\nexport function primaryShortcut(id) {\n  const s = commands.get(id)?.shortcut;\n  return Array.isArray(s) ? s[0] : (s ?? null);\n}\n\n/** Global keydown handler. Returns true if a command handled the event. */\nexport function handleShortcut(event) {\n  const editable = event.target?.closest?.('input, textarea, select, [contenteditable=\"true\"]');\n  for (const c of commands.values()) {\n    if (!c.shortcut) continue;\n    const list = Array.isArray(c.shortcut) ? c.shortcut : [c.shortcut];\n    const hit = list.find((s) => matchShortcut(event, s));\n    if (!hit) continue;\n    // In text fields only modifier/function-key shortcuts apply.\n    if (editable && !/Mod|Ctrl|Alt|(^|\\+)F\\d+$/.test(hit)) continue;\n    if (!c.enabled()) continue;\n    event.preventDefault();\n    c.run();\n    return true;\n  }\n  re
