/* Design tokens. All theming goes through these custom properties.
   The theme is chosen by [data-theme] on <html> (set before first paint). */

:root {
  /* Type */
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-xs: 11px;
  --text-sm: 12px;
  --text-md: 13px;
  --text-lg: 15px;
  --text-xl: 18px;

  /* Spacing (4px grid) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  /* Shape & sizing */
  --radius: 6px;
  --radius-sm: 4px;
  --control-h: 30px;
  --control-h-sm: 28px;
  --control-h-lg: 32px;
  --topbar-h: 40px;
  --statusbar-h: 28px;
  --page-gap: 16px;

  /* Motion */
  --ease: cubic-bezier(.2, .7, .3, 1);
  --dur-fast: 90ms;
  --dur: 160ms;

  /* Accent (shared by both themes) */
  --accent: #b70228;
  --accent-hover: #8a011e;
  --accent-contrast: #ffffff;
  --logo-fold: #f0a3b3;
  --logo-lines: rgba(255, 255, 255, .9);
}

/* Light theme */
:root,
:root[data-theme="light"] {
  --bg: #f6f7f8;
  --panel: #ffffff;
  --panel-2: #f0f2f4;
  --border: #d9dde1;
  --border-strong: #c3c9cf;
  --text: #1e2327;

  --hover: rgba(30, 35, 39, .06);

  --page-shadow: 0 1px 3px rgba(0, 0, 0, .14), 0 4px 14px rgba(0, 0, 0, .08);

  --accent-soft: rgba(183, 2, 40, .08);

:root[data-theme="dark"] {

/* Reset + base controls shared by every screen. */

*,
*::before,
*::after { box-sizing: border-box; }

html,
body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: var(--text-md)/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: var(--text-xl); font-weight: 600; }
h2 { font-size: var(--text-lg); font-weight: 600; }
h3 { font-size: var(--text-md); font-weight: 600; }

button,
input,
select,
textarea { font: inherit; color: inherit; }

.muted { color: var(--text-muted); }

:focus { outline: none; }
:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.icon { flex: none; display: block; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  height: var(--control-h);
  padding: 0 var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:active:not(:disabled) { background: var(--active); }
.btn:disabled { opacity: .55; cursor: default; }

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-contrast);
}
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn.icon-btn {
  width: var(--control-h-sm);
  height: var(--control-h-sm);
  padding: 0;
  border-color: transparent;
  background: transparent;
  color: var(--text-muted);
}
.btn.icon-btn:hover { color: var(--text); }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 6px;
  border-radius: 9px;
  background: var(--badge-bg);
  color: var(--badge-text);
  font-size: var(--text-xs);
  font-weight: 500;
  white-space: nowrap;
}

/* Boot splash (replaced once the app starts) */
.boot-splash {
  display: grid;
  place-items: center;
  height: 100%;
  color: var(--text-muted);
}
.boot-error {
  max-width: 520px;
  margin: 15vh auto 0;
  padding: var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
}

/* Scrollbars that suit both themes */
* { scrollbar-color: var(--border-strong) transparent; }

/* App shell: top bar, workspace (tools panel · viewport · side panel · rail). */

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ---------------------------------------------------------- top bar */
.topbar {
  display: flex;
  align-items: center;
  gap: var(--space-2);

  border-bottom: 1px solid var(--border);
  min-width: 0;

  gap: var(--space-2);

  font-weight: 600;
  user-select: none;

.menubar-slot { flex: none; }

  height: var(--control-h-sm);

  font-size: var(--text-xs);

@media (max-width: 1100px) { .palette-btn-text { display: none; } }

/* ------------------------------------------------------------- tabs */
.tabstrip {
  display: flex;
  align-items: center;
  gap: 2px;
  min-width: 0;
  flex: 1;
  height: 100%;
  padding-left: var(--space-2);
  border-left: 1px solid var(--border);
}
.home-btn[aria-pressed="true"] { color: var(--accent-text); background: var(--accent-soft); }
.tab-scroller {

  height: 100%;

  overflow-y: hidden;
  scrollbar-width: none;

.tab-scroller::-webkit-scrollbar { display: none; }
.tab-list { display: flex; align-items: stretch; height: 100%; }
.tab-item {
  position: relative;

  flex: none;
  max-width: 220px;
  height: 100%;
  border-right: 1px solid transparent;
}
.tab-item::after {
  content: "";
  position: absolute;
  left: 6px;
  right: 6px;
  bottom: 0;
  height: 2px;
  border-radius: 2px 2px 0 0;
  background: transparent;
}
.tab-item.active::after { background: var(--accent); }
.tab {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  height: 100%;
  padding: 0 28px 0 var(--space-3);
  border: 0;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;

.tab-item:hover .tab { color: var(--text); }
.tab-item.active .tab { color: var(--text); font-weight: 500; }
.tab:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tab-item:hover .tab-close,
.tab-item.active .tab-close { opacity: 1; }
.tab-close:hover { background: var(--hover); color: var(--text); }
.tab-open { flex: none; }

/* --------------------------------------------------------- workspace */
.workspace {
  position: relative;
  display: flex;
  flex: 1;
  min-height: 0;
}
.main {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow: auto;
  order: 3;

.tools-panel { order: 1; }
.tools-splitter { order: 2; }
.workspace[data-tools-side="right"] .main { order: 1; }
.workspace[data-tools-side="right"] .tools-panel { order: 3; border-right: 0; border-left: 1px solid var(--border); }

.side-splitter { order: 4; }
.side-panel { order: 5; }
.rail { order: 6; }

.splitter {
  position: relative;
  flex: none;
  width: 5px;
  margin: 0 -2px;
  z-index: 3;
  cursor: col-resize;
  touch-action: none;

.splitter[hidden] { display: none; }
.splitter::after {
  content: "";
  position: absolute;
  inset: 0 2px;

.splitter:hover::after,
.splitter.dragging::after,
.splitter:focus-visible::after { background: var(--accent); }
.splitter:focus-visible { box-shadow: none; }
.resizing, .resizing * { cursor: col-resize !important; user-select: none !important; }

.read-mode .topbar,
.read-mode .status-slot,
.read-mode .tools-panel,
.read-mode .side-panel,
.read-mode .rail,
.read-mode .splitter { display: none; }

.input {
  height: var(--control-h-sm);
  padding: 0 var(--space-2);
  border: 1px solid var(--border);

.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }
.btn.icon-btn:disabled { opacity: .4; }

  align-items: center;
  gap: var(--space-2);

.comment-thread:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.comment-thread:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.comment-thread.selected { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.comment-thread.resolved > .comment-text { color: var(--text-muted); }
.comment-head { display: flex; align-items: center; gap: var(--space-2); min-height: 24px; }
.comment-type-icon, .comment-reply-icon { display: inline-flex; flex: none; }
.comment-reply-icon { color: var(--text-muted); }
.comment-meta { display: flex; flex: 1; min-width: 0; flex-wrap: wrap; align-items: baseline; column-gap: var(--space-2); }
.comment-author { overflow: hidden; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; }
.comment-time { font-size: 11px; }
.comment-actions { display: flex; flex: none; gap: 0; opacity: .55; transition: opacity .1s; }
.comment-thread:hover .comment-actions,
.comment-thread:focus-within .comment-actions,
.comment-thread.selected .comment-actions { opacity: 1; }
.btn.icon-btn.btn-xs { width: 24px; height: 24px; padding: 0; border-color: transparent; background: transparent; }
.btn.icon-btn.btn-xs:hover:not(:disabled) { background: var(--panel-2); }
.comment-resolved { flex: none; }
.comment-text { margin: var(--space-1) 0 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.comment-text.muted { font-style: italic; }
.comment-replies { margin: var(--space-2) 0 0 var(--space-3); padding-left: var(--space-2); border-left: 2px solid var(--border); }
.comment-reply + .comment-reply { margin-top: var(--space-2); }
.comment-editor { display: flex; flex-direction: column; gap: var(--space-1); margin-top: var(--space-2); cursor: auto; }
.comment-textarea { width: 100%; min-height: 56px; padding: var(--space-1) var(--space-2); resize: vertical; font: inherit; }
.comment-editor-actions { display: flex; justify-content: flex-end; gap: var(--space-1); }
</style>

  <noscript>PDF Editor needs JavaScript to run.</noscript>
  <script type="application/json" id="app-modules">{"@app/core/autosave.js":"// Autosave of unsaved work to IndexedDB, and the records offered for\n// recovery on the next launch.\nimport { idb } from '@app/core/idb.js';\n\n/**\n * @param {{ id: string, name: string, bytes: Uint8Array, handle?: any, steps?: string[] }} rec\n */\nexport async function writeAutosave({ id, name, bytes, handle = null, steps = [] }) {\n  try {\n    await idb.put('autosave', {\n      id,\n      name,\n      bytes: new Blob([bytes], { type: 'application/pdf' }),\n      size: bytes.length,\n      handle,\n      steps,\n      savedAt: Date.now(),\n    });\n    return true;\n  } catch {\n    // Some browsers can't store file handles; retry without it.\n    try {\n      await idb.put('autosave', { id, name, bytes: new Blob([bytes], { type: 'application/pdf' }), size: bytes.length, handle: null, steps, savedAt: Date.now() });\n      return true;\n    } catch {\n      return false;\n    }\n  }\n}\n\nexport async function listAutosaves() {\n  try {\n    return (await idb.getAll('autosave')).sort((a, b) => b.savedAt - a.savedAt);\n  } catch {\n    return [];\n  }\n}\n\nexport async function deleteAutosave(id) {\n  try {\n    await idb.delete('autosave', id);\n  } catch {\n    /* ignore */\n  }\n}\n","@app/core/document-model.js":"// The editable document behind a tab: the current bytes, the snapshot undo\n// history and the saved state. Every change goes through execute() (a named\n// step, run by the pdf-lib worker) or undo/redo/jumpTo. Operations are\n// serialised; `onChange` (the tab reloading its view) is awaited inside the\n// queue, so the view and the model never disagree.\nimport { UndoHistory, newVersion } from '@app/core/undo-history.js';\nimport { applyOp, runQuery, closeWorkerDoc } from '@app/core/pdf-worker.js';\n\nexport class ReadOnlyError extends Error {\n  constructor(reason) {\n    super(`This document can't be edited (${reason})`);\n    this.name = 'ReadOnlyError';\n    this.reason = reason;\n  }\n}\n\nlet nextDoc = 1;\n\nexport class DocumentModel extends EventTarget {\n  /**\n   * @param {object} o\n   * @param {Uint8Array} o.bytes\n   * @param {number} o.pageCount\n   * @param {string} o.openLabel        label of the initial history entry\n   * @param {boolean} [o.clean]         false for recovered documents (not saved anywhere)\n   * @param {string|null} [o.readOnly]  reason, e.g. 'encrypted'\n   * @param {(change) => Promise} o.onChange\n   * @param {object} [o.limits]\n   */\n  constructor({ bytes, pageCount, openLabel, clean = true, readOnly = null, onChange, limits }) {\n    super();\n    this.docId = `d${nextDoc++}`;\n    this.history = new UndoHistory({\n      version: newVersion(),\n      label: openLabel,\n      bytes,\n      pageCount,\n      affected: null,\n      time: Date.now(),\n      initial: true,\n    }, limits);\n    this.savedEntry = clean ? this.history.current : null;\n    this.readOnly = readOnly;\n    this.onChange = onChange;\n    this.queue = Promise.resolve();\n    this.busy = false;\n    this.fileHandle = null;\n  }\n\n  get bytes() {\n    return this.history.current.bytes;\n  }\n\n  get dirty() {\n    return this.history.current !== this.savedEntry;\n  }\n\n  get canUndo() {\n    return this.history.canUndo;\n  }\n\n  get canRedo() {\n    return this.history.canRedo;\n  }\n\n  /** Serialise a task behind every earlier one. */\n  enqueue(task) {\n    const run = this.queue.then(async () => {\n      this.busy = true;\n      this.emit('busychange');\n      try {\n        return await task();\n      } finally {\n        this.busy = false;\n        this.emit('busychange');\n      }\n    });\n    this.queue = run.catch(() => {});\n    return run;\n  }\n\n  /**\n   * Run a named operation as one undo step.\n   * @param {string} op     worker op name (core/ops)\n   * @param {object} args\n   * @param {string} label  user-facing step name\n   */\n  execute(op, args, label) {\n    return this.enqueue(async () => {\n      if (this.readOnly) throw new ReadOnlyError(this.readOnly);\n      const from = this.history.current;\n      const version = newVersion();\n      let result;\n      try {\n        result = await applyOp({\n          docId: this.docId,\n          version: from.version,\n          newVersion: version,\n          op,\n          args,\n          getBytes: () => from.bytes,\n        });\n      } catch (err) {\n        if (err.name === 'EncryptedPDFError') {\n          this.readOnly = 'encrypted';\n          this.emit('readonlychange');\n          throw new ReadOnlyError('encrypted');\n        }\n        throw err;\n      }\n      const entry = {\n        version,\n        label,\n        bytes: result.bytes,\n        pageCount: result.pageCount,\n        affected: result.affected,\n        time: Date.now(),\n      };\n      this.history.push(entry);\n      await this.changed({\n        from,\n        to: entry,\n        affected: result.affected,\n        structural: from.pageCount !== entry.pageCount,\n      });\n      return result.value;\n    });\n  }\n\n  /** A read-only operation on the current state (nothing is recorded). */\n  query(op, args) {\n    return this.enqueue(async () => {\n      const cur = this.history.current;\n      return runQuery({ docId: this.docId, version: cur.version, op, args, getBytes: () => cur.bytes });\n    });\n  }\n\n  undo() {\n    return this.enqueue(async () => {\n      if (!this.history.canUndo) return false;\n      await this.changed(this.history.moveTo(this.history.index - 1));\n      return true;\n    });\n  }\n\n  redo() {\n    return this.enqueue(async () => {\n      if (!this.history.canRedo) return false;\n      await this.changed(this.history.moveTo(this.history.index + 1));\n      return true;\n    });\n  }\n\n  /** Jump to any entry of the history (Undo History panel). */\n  jumpTo(entry) {\n    return this.enqueue(async () => {\n      if (entry === this.history.current) return false;\n      await this.changed(this.history.moveTo(entry));\n      return true;\n    });\n  }\n\n  async changed(change) {\n    try {\n      await this.onChange?.(change);\n    } finally {\n      this.emit('historychange');\n      this.emit('dirtychange');\n    }\n  }\n\n  /** Mark the document read-only (e.g. it turned out to be encrypted). */\n  setReadOnly(reason) {\n    if (this.readOnly === reason) return;\n    this.readOnly = reason;\n    this.emit('readonlychange');\n  }\n\n  markSaved() {\n    this.savedEntry = this.history.current;\n    this.emit('dirtychange');\n    this.emit('historychange');\n  }\n\n  emit(type, detail = {}) {\n    this.dispatchEvent(new CustomEvent(type, { detail }));\n  }\n\n  dispose() {\n    closeWorkerDoc(this.docId);\n  }\n}\n","@app/core/idb.js":"// Minimal IndexedDB helper. Every call fails soft: if storage is blocked\n// (private windows, disabled site data) the app keeps working without it.\n\nconst DB_NAME = 'pdf-editor';\nconst DB_VERSION = 2;\n\n// Object stores: recents (metadata + thumbnail), recentFiles (bytes),\n// autosave (M4), signatures (M9), prefs (v2). Upgrades only add stores.\nconst STORES = {\n  recents: { keyPath: 'id' },\n  recentFiles: { keyPath: 'id' },\n  autosave: { keyPath: 'id' },\n  signatures: { keyPath: 'id' },\n  prefs: { keyPath: 'key' }, // mirror of localStorage preferences (v2)\n};\n\nlet dbPromise = null;\n\nexport function openDb() {\n  if (!dbPromise) {\n    dbPromise = new Promise((resolve, reject) => {\n      let req;\n      try {\n        req = indexedDB.open(DB_NAME, DB_VERSION);\n      } catch (err) {\n        reject(err);\n        return;\n      }\n      req.onupgradeneeded = () => {\n        const db = req.result;\n        for (const [name, opts] of Object.entries(STORES)) {\n          if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, opts);\n        }\n      };\n      req.onsuccess = () => resolve(req.result);\n      req.onerror = () => reject(req.error);\n      req.onblocked = () => reject(new Error('IndexedDB upgrade blocked'));\n    }).catch((err) => {\n      dbPromise = null;\n      throw err;\n    });\n  }\n  return dbPromise;\n}\n\nfunction promisify(req) {\n  return new Promise((resolve, reject) => {\n    req.onsuccess = () => resolve(req.result);\n    req.onerror = () => reject(req.error);\n  });\n}\n\nasync function withStore(name, mode, fn) {\n  const db = await openDb();\n  const tx = db.transaction(name, mode);\n  const result = await fn(tx.objectStore(name));\n  await new Promise((resolve, reject) => {\n    tx.oncomplete = resolve;\n    tx.onerror = () => reject(tx.error);\n    tx.onabort = () => reject(tx.error ?? new Error('transaction aborted'));\n  });\n  return result;\n}\n\n/** Empty every store (used by tests and for \"forget everything\"). */\nexport async function clearAllStores() {\n  for (const name of Object.keys(STORES)) {\n    try {\n      await withStore(name, 'readwrite', (s) => promisify(s.clear()));\n    } catch {\n      /* ignore */\n    }\n  }\n}\n\nexport const idb = {\n  get: (store, key) => withStore(store, 'readonly', (s) => promisify(s.get(key))),\n  getAll: (store) => withStore(store, 'readonly', (s) => promisify(s.getAll())),\n  put: (store, value) => withStore(store, 'readwrite', (s) => promisify(s.put(value))),\n  delete: (store, key) => withStore(store, 'readwrite', (s) => promisify(s.delete(key))),\n  clear: (store) => withStore(store, 'readwrite', (s) => promisify(s.clear())),\n};\n","@app/core/jobs.js":"// Run a long job (combine / split / extract) in its own disposable worker.\n// Progress is reported as it goes; cancel() terminates the worker at once,\n// without disturbing the editing worker.\nimport { workerUrl } from '@app/core/worker-source.js';\n\nexport class JobCancelled extends Error {\n  constructor() {\n    super('Cancelled');\n    this.name = 'JobCancelled';\n  }\n}\n\n/**\n * @param {string} job   name in core/ops/jobs.js\n * @param {object} args\n * @param {{ onProgress?: (p: {done:number,total:number,label:string}) => void, transfer?: ArrayBuffer[] }} [o]\n * @returns {{ promise: Promise\u003cany>, cancel: () => void }}\n */\nexport function runJob(job, args, { onProgress, transfer = [] } = {}) {\n  let worker = null;\n  let settled = false;\n  let rejectFn;\n  const promise = new Promise((resolve, reject) => {\n    rejectFn = reject;\n    workerUrl({ zip: true }).then((url) => {\n      if (settled) return;\n      worker = new Worker(url, { name: `job-${job}` });\n      URL.revokeObjectURL(url);\n      worker.onmessage = (e) => {\n        const msg = e.data;\n        if (msg.progress) {\n          onProgress?.(msg.progress);\n          return;\n        }\n        settled = true;\n        worker.terminate();\n        if (msg.ok) resolve(msg.value);\n        else {\n          const err = new Error(msg.error?.message ?? 'Job failed');\n          err.name = msg.error?.name ?? 'JobError';\n          reject(err);\n        }\n      };\n      worker.onerror = (e) => {\n        if (settled) return;\n        settled = true;\n        worker.terminate();\n        reject(new Error(e.message || 'Job worker failed'));\n      };\n      worker.postMessage({ id: 1, type: 'job', job, args }, transfer);\n    }, (err) => {\n      settled = true;\n      reject(err);\n    });\n  });\n  return {\n    promise,\n    cancel() {\n      if (settled) return;\n      settled = true;\n      worker?.terminate();\n      rejectFn(new JobCancelled());\n    },\n  };\n}\n","@app/core/libs.config.js":"// Single source of truth for third-party library versions.\n//\n// Every library is loaded from jsDelivr at a pinned version. The end-to-end\n// tests read this file too: they serve the same paths from node_modules\n// (package.json devDependencies must carry the same versions — the test\n// harness fails loudly if they drift).\n//\n// Keep this file free of imports so Node can import it directly.\n\nexport const CDN_BASE = 'https://cdn.jsdelivr.net/npm';\n\nexport const LIBS = {\n  pdfjs: {\n    pkg: 'pdfjs-dist',\n    version: '6.5.438',\n    license: 'Apache-2.0',\n    homepage: 'https://mozilla.github.io/pdf.js/',\n    files: {\n      main: 'build/pdf.min.mjs',\n      worker: 'build/pdf.worker.min.mjs',\n      cmaps: 'cmaps/',\n      standardFonts: 'standard_fonts/',\n      wasm: 'wasm/',\n      iccs: 'iccs/',\n    },\n  },\n  pdfLib: {\n    pkg: 'pdf-lib',\n    version: '1.17.1',\n    license: 'MIT',\n    homepage: 'https://pdf-lib.js.org/',\n    files: {\n      main: 'dist/pdf-lib.esm.min.js',\n      umd: 'dist/pdf-lib.min.js',\n    },\n  },\n  fflate: {\n    pkg: 'fflate',\n    version: '0.8.3',\n    license: 'MIT',\n    homepage: 'https://github.com/101arrowz/fflate',\n    files: {\n      main: 'esm/browser.js',\n      umd: 'umd/index.js',\n    },\n  },\n  tesseract: {\n    pkg: 'tesseract.js',\n    version: '7.0.0',\n    license: 'Apache-2.0',\n    homepage: 'https://tesseract.projectnaptha.com/',\n    files: {\n      main: 'dist/tesseract.esm.min.js',\n    },\n  },\n};\n\n/** Absolute CDN URL for a file of a pinned library. */\nexport function libUrl(name, file = 'main') {\n  const lib = LIBS[name];\n  if (!lib) throw new Error(`Unknown library: ${name}`);\n  const path = lib.files[file] ?? file;\n  return `${CDN_BASE}/${lib.pkg}@${lib.version}/${path}`;\n}\n","@app/core/libs.js":"// Lazy loaders for the CDN libraries. Each library is fetched at most once.\nimport { libUrl } from '@app/core/libs.config.js';\n\nconst cache = new Map();\n\nfunction once(key, loader) {\n  if (!cache.has(key)) {\n    const p = loader().catch((err) => {\n      cache.delete(key); // allow a retry after a network failure\n      throw err;\n    });\n    cache.set(key, p);\n  }\n  return cache.get(key);\n}\n\n/** pdf.js main module (the worker is wired up by the viewer, see view/). */\nexport function loadPdfjs() {\n  return once('pdfjs', () => import(libUrl('pdfjs')));\n}\n\n/** pdf-lib ES module (main thread use; heavy work runs in a worker later). */\nexport function loadPdfLib() {\n  return once('pdfLib', () => import(libUrl('pdfLib')));\n}\n\n/** fflate for zipping split outputs. */\nexport function loadFflate() {\n  return once('fflate', () => import(libUrl('fflate')));\n}\n","@app/core/ops/annot-helpers.js":"// Annotation helpers for the worker: build PDF annotation dictionaries with\n// real appearance streams (so Acrobat, Preview and browsers show them), read\n// them back, move/resize them and rebuild their appearance.\n//\n// Each helper is self-contained (serialised into the worker); helpers that use\n// others receive the helper table `H`.\n//\n// Spec objects (what the UI sends) use PDF user-space coordinates:\n//   { type: 'highlight'|'underline'|'strikeout'|'square'|'circle'|'line'|'ink'|'freetext'|'note',\n//     rect, quads (QuadPoints, 8 numbers each), line [x1,y1,x2,y2], arrow, ink [[x,y,x,y…]…],\n//     text, fontSize, color '#rrggbb', opacity 0..1, width, contents, author }\n\n/** \"#b70228\" → [0.717, 0.008, 0.157] */\nexport function hexToRgb(hex) {\n  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));\n  const n = m ? parseInt(m[1], 16) : 0;\n  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];\n}\n\n/** [r,g,b] (0..1) → \"#rrggbb\" */\nexport function rgbToHex(rgb) {\n  if (!rgb || rgb.length \u003c 3) return '#000000';\n  return `#${rgb.slice(0, 3).map((v) => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')).join('')}`;\n}\n\n/** pdf.js-style id (\"12R\", or \"12R3\" for generation 3) ↔ PDFRef. */\nexport function refFromId(L, id) {\n  const m = /^(\\d+)R(\\d*)$/.exec(String(id));\n  if (!m) throw new Error(`Bad annotation id ${id}`);\n  return L.PDFRef.of(Number(m[1]), m[2] ? Number(m[2]) : 0);\n}\n\nexport function idFromRef(ref) {\n  return ref.generationNumber ? `${ref.objectNumber}R${ref.generationNumber}` : `${ref.objectNumber}R`;\n}\n\n/** PDF date string for now: D:YYYYMMDDHHmmSSZ */\nexport function pdfDate(d = new Date()) {\n  const p = (n) => String(n).p ocument's outline: [{ title, page (0-based|null), open, children }]. */\nexport function readOutline(L, doc) {\n  const { PDFName, PDFRef, PDFDict, PDFArray, PDFString, PDFHexString, PDFNumber } = L;\n  const N = (n) => PDFName.of(n);\n  const ctx = doc.context;\n  const lookup = (o) => (o instanceof PDFRef ? ctx.lookup(o) : o);\n  const pageIndex = new Map(doc.getPages().map((p, i) => [p.ref.toString(), i]));\n  const text = (o) => (o instanceof PDFString || o instanceof PDFHexString ? o.decodeText() : o instanceof PDFName ? o.decodeText() : null);\n\n  // Named destinations: catalog /Dests (dict) and /Names /Dests (name tree).\n  const named = (name) => {\n    const dests = lookup(doc.catalog.get(N('Dests')));\n    if (dests instanceof PDFDict) {\n      const hit = lookup(dests.get(N(name)));\n      if (hit) return hit;\n    }\n    const names = lookup(doc.catalog.get(N('Names')));\n    const tree = names instanceof PDFDict ? lookup(names.get(N('Dests'))) : null;\n    const search = (node, depth) => {\n      if (!(node instanceof PDFDict) || depth > 32) return null;\n      const list = lookup(node.get(N('Names')));\n      if (list instanceof PDFArray) {\n        for (let i = 0; i + 1 \u003c list.size(); i += 2) {\n          if (text(lookup(list.get(i))) === name) return lookup(list.get(i + 1));\n        }\n      }\n      const kids = lookup(node.get(N('Kids')));\n      if (kids instanceof PDFArray) {\n        for (let i = 0; i \u003c kids.size(); i++) {\n          const found = search(lookup(kids.get(i)), depth + 1);\n          if (found) return found;\n        }\n      }\n      return null;\n    };\n    return search(tree, 0);\n  };\n\n  const destPage = (item) => {\n    let dest = lookup(item.get(N('Dest')));\n    if (!dest) {\n      const action = lookup(item.get(N('A')));\n      if (action instanceof PDFDict && String(action.get(N('S'))) === '/GoTo') dest = lookup(action.get(N('D')));\n    }\n    const name = text(dest);\n    if (name !== null) dest = named(na ext;\n  const pages = doc.getPages();\n  const rootRef = ctx.nextRef();\n  const build = (nodes, parentRef) => {\n    const refs = nodes.map(() => ctx.nextRef());\n    let visible = 0;\n    nodes.forEach((node, i) => {\n      const dict = {\n        Title: PDFHexString.fromText(node.title || ''),\n        Parent: parentRef,\n      };\n      const page = pages[Math.max(0, Math.min(pages.length - 1, node.page ?? 0))];\n      if (page) dict.Dest = [page.ref, N('XYZ'), null, null, null];\n      if (i > 0) dict.Prev = refs[i - 1];\n      if (i \u003c nodes.length - 1) dict.Next = refs[i + 1];\n      if (node.children && node.children.length) {\n        const sub = build(node.children, refs[i]);\n        dict.First = sub.first;\n        dict.Last = sub.last;\n        dict.Count = node.open ? sub.count : -sub.count;\n        if (node.open) visible += sub.count;\n      }\n      ctx.assign(refs[i], ctx.obj(dict));\n      visible += 1;\n    });\n    return { first: refs[0], last: refs[refs.length - 1], count: visible };\n  };\n  if (!items.length) return;\n  const top = build(items, rootRef);\n  ctx.assign(rootRef, ctx.obj({ Type: 'Outlines', First: top.first, Last: top.last, Count: top.count }));\n  doc.catalog.set(N('Outlines'), rootRef);\n}\n\n/**\n * After copyPages(): register the form fields whose widgets came along in\n * `out`'s AcroForm, renaming top-level fields whose names are already used.\n */\nexport function carryFields(L, out, src, copiedPages, usedNames) {\n  const { PDFName, PDFRef, PDFDict, PDFArray, PDFHexString, PDFString, PDFObjectCopier } = L;\n  const N = (n) => PDFName.of(n);\n  const ctx = out.context;\n  const lookup = (o) => (o instanceof PDFRef ? ctx.lookup(o) : o);\n  const roots = [];\n  const seen = new Set();\n  for (const page of copiedPages) {\n    const annots = lookup(page.node.get(N('Annots')));\n    if (!(annots instanceof PDFArray)) continue;\n    for (let i = 0; i \u003c annots.size(); i++) {\n      let ref = annots.get(i);\n      let node = lookup(ref);\n      if (!(node instanceof PDFDict) || String(node.get(N('Subtype'))) !== '/Widget') continue;\n      let guard = 0;\n      while (node.get(N('Parent')) instanceof PDFRef && guard++ \u003c 32) {\n        ref = node.get(N('Parent'));\n        node = ctx.lookup(ref);\n      }\n      if (!(ref instanceof PDFRef) || seen.has(ref.toString())) continue;\n      seen.add(ref.toString());\n      roots.push({ ref, node });\n    }\n  }\n  if (!roots.length) return 0;\n\n  let acro = lookup(out.catalog.get(N('AcroForm')));\n  if (!(acro instanceof PDFDict)) {\n    acro = ctx.obj({ Fields: [] });\n    out.catalog.set(N('AcroForm'), ctx.register(acro));\n  }\n  let fields = lookup(acro.get(N('Fields')));\n  if (!(fields instanceof PDFArray)) {\n    fields = ctx.obj([]);\n    acro.set(N('Fields'), fields);\n  }\n  for (const { ref, node } of roots) {\n    const t = node.get(N('T'));\n    let name = t instanceof PDFString || t instanceof PDFHexString ? t.decodeText() : null;\n    if (name !== null) {\n      if (usedNames.has(name)) {\n        let k = 2;\n        while (usedNames.has(`${name}_${k}`)) k++;\n        name = `${name}_${k}`;\n        node.set(N('T'), PDFHexString.fromText(name));\n      }\n      usedNames.add(name);\n    }\n    fields.push(ref);\n  }\n  // Default appearance resources so viewers can draw the fields.\n  const srcAcro = src.catalog.lookup(N('AcroForm'));\n  if (srcAcro instanceof PDFDict) {\n    const copier = PDFObjectCopier.for(src.context, ctx);\n    for (const key of ['DR', 'DA', 'NeedAppearances']) {\n      const v = srcAcro.get(N(key));\n      if (v !== undefined && acro.get(N(key)) === undefined) acro.set(N(key), copier.copy(v));\n    }\n  }\n  return roots.length;\n}\n\n/** Copy title/author/subject/keywords/creator/language from one document to another. */\nexport function copyMeta(L, src, out) {\n  const s = (f) => {\n    try {\n      return f();\n    } catch {\n      return undefined;\n    }\n  };\n  const title = s(() => src.getTitle());\n  const author = s(() => src.getAuthor());\n  const subject = s(() => src.getSubject());\n  const keywords = s(() => src.getKeywords());\n  const creator = s(() => src.getCreator());\n  if (title) out.setTitle(title);\n  if (author) out.setAuthor(author);\n  if (subject) out.setSubject(subject);\n  if (keywords) out.setKeywords(keywords.split(/\\s*[,;]\\s*|\\s+/).filter(Boolean));\n  if (creator) out.setCreator(creator);\n  const lang = src.catalog.get(L.PDFName.of('Lang'));\n  if (lang) out.catalog.set(L.PDFName.of('Lang'), lang);\n  out.setProducer('PDF Editor');\n}\n\n/**\n * Copy pages (one copyPages call, so links between them keep working),\n * their form fields, the matching part of the outline and the metadata.\n * Returns the new pages' starting index in `out`.\n */\nexport async function appendPages(L, H, out, src, pages, usedNames) {\n  const { PDFName, PDFNumber } = L;\n  const TAG = PDFName.of('PDFEditorSrcPage');\n  // Tag source pages so link targets can be traced after copying (pdf-lib's\n  // copier gives each page a link points at its own detached clone).\n  src.getPages().forEach((p, i) => p.node.set(TAG, PDFNumber.of(i)));\n  const start = out.getPageCount();\n  const copies = await out.copyPages(src, pages);\n  copies.forEach((p) => out.addPage(p));\n  const placed = new Map();\n  pages.forEach((p, k) => {\n    if (!placed.has(p)) placed.set(p, copies[k]);\n  });\n  H.fixLinks(L, out, copies, placed, TAG);\n  H.carryFields(L, out, src, copies, usedNames);\n  const outline = H.mapOutline(H.readOutline(L, src), (i) => (placed.has(i) ? start + pages.indexOf(i) : null));\n  return { start, outline };\n}\n\n/**\n * Point copied links at the placed copies of their target pages; links to\n * pages that weren't copied lose their destination. Detached page clones are\n * deleted so they don't bloat the file. Removes the TAG afterwards.\n */\nexport function fixLinks(L, out, copies, placed, TAG) {\n  const { PDFName, PDFRef, PDFDict, PDFArray, PDFNumber } = L;\n  const N = (n) => PDFName.of(n);\n  const ctx = out.context;\n  const lookup = (o) => (o instanceof PDFRef ? ctx.lookup(o) : o);\n  const placedRefs = new Set(copies.map((p) => p.ref.toString()));\n  const orphans = new Map();\n  for (const page of copies) {\n    const annots = lookup(page.node.get(N('Annots')));\n    if (!(annots instanceof PDFArray)) continue;\n    for (let i = 0; i \u003c annots.size(); i++) {\n      const annot = lookup(annots.get(i));\n      if (!(annot instanceof PDFDict) || String(annot.get(N('Subtype'))) !== '/Link') continue;\n      let holder = annot;\n      let key = 'Dest';\n      let dest = lookup(annot.get(N('Dest')));\n      if (!dest) {\n        const action = lookup(annot.get(N('A')));\n        if (action instanceof PDFDict && String(action.get(N('S'))) === '/GoTo') {\n          holder = action;\n          key = 'D';\n          dest = lookup(action.get(N('D')));\n        }\n      }\n      if (!(dest instanceof PDFArray) || !(dest.get(0) instanceof PDFRef)) continue;\n      const targetRef = dest.get(0);\n      if (placedRefs.has(targetRef.toString())) continue;\n      const target = ctx.lookup(targetRef);\n      const tag = target instanceof PDFDict ? target.get(TAG) : null;\n      if (!(tag instanceof PDFNumber)) continue;\n      orphans.set(targetRef.toString(), targetRef);\n      const real = placed.get(tag.asNumber());\n      if (real) {\n        dest.set(0, real.ref);\n      } else {\n        holder.delete(N(key));\n        if (holder !== annot) annot.delete(N('A'));\n      }\n    }\n  }\n  for (const ref of orphans.values()) ctx.delete(ref);\n  for (const page of copies) page.node.delete(TAG);\n}\n","@app/core/page-order.js":"// Pure helpers for reordering pages.\n\n/**\n * Move the `selected` pages (0-based, any order) so they land, in their\n * current relative order, at insertion point `target` — an index in the\n * *original* order (0 = before the first page, count = after the last).\n * @returns {{ order: number[], selection: number[], changed: boolean }}\n *   order[k] = old index of the page now at position k\n */\nexport function moveSelection(count, selected, target) {\n  const sel = [...new Set(selected)].filter((i) => i >= 0 && i \u003c count).sort((a, b) => a - b);\n  const set = new Set(sel);\n  const rest = [];\n  for (let i = 0; i \u003c count; i++) if (!set.has(i)) rest.push(i);\n  const clamped = Math.max(0, Math.min(count, target));\n  const pos = rest.filter((i) => i \u003c clamped).length;\n  const order = [...rest.slice(0, pos), ...sel, ...rest.slice(pos)];\n  const changed = order.some((old, k) => old !== k);\n  return { order, selection: sel.map((_, k) => pos + k), changed };\n}\n\n/** Move the selection one step left (-1) or right (+1). */\nexport function nudgeSelection(count, selected, dir) {\n  const sel = [...new Set(selected)].sort((a, b) => a - b);\n  if (!sel.length) return { order: [...Array(count).keys()], selection: [], changed: false };\n  const target = dir \u003c 0 ? sel[0] - 1 : sel.at(-1) + 2;\n  return moveSelection(count, sel, target);\n}\n","@app/core/page-range.js":"// Page range strings: \"1-3, 7, 10-\" → 0-based indexes.\n\n/**\n * @param {string} text   e.g. \"1-3, 7, 10-\", \"-4\", \"all\", \"\" (= all)\n * @param {number} count  number of pages\n * @returns {{ pages: number[] } | { error: string }}  pages in the given order, deduplicated\n */\nexport function parsePageRange(text, count) {\n  const value = String(text ?? '').trim().toLowerCase();\n  if (!value || value === 'all') return { pages: [...Array(count).keys()] };\n  const out = [];\n  const seen = new Set();\n  for (const raw of value.split(/[,;\\s]+/).filter(Boolean)) {\n    const m = raw.match(/^(\\d*)\\s*-\\s*(\\d*)$|^(\\d+)$/);\n    if (!m) return { error: raw };\n    let from;\n    let to;\n    if (m[3]) {\n      from = to = Number(m[3]);\n    } else {\n      from = m[1] ? Number(m[1]) : 1;\n      to = m[2] ? Number(m[2]) : count;\n    }\n    if (from \u003c 1 || to \u003c 1 || from > count || to > count) return { error: raw };\n    const step = from \u003c= to ? 1 : -1;\n    for (let p = from; step > 0 ? p \u003c= to : p >= to; p += step) {\n      if (!seen.has(p)) {\n        seen.add(p);\n        out.push(p - 1);\n      }\n    }\n  }\n  return out.length ? { pages: out } : { error: value };\n}\n\n/** 0-based indexes → compact \"1-3, 7\" text. */\nexport function formatPageRange(pages) {\n  const sorted = [...new Set(pages)].sort((a, b) => a - b);\n  const parts = [];\n  for (let i = 0; i \u003c sorted.length; i++) {\n    let j = i;\n    while (j + 1 \u003c sorted.length && sorted[j + 1] === sorted[j] + 1) j++;\n    parts.push(i === j ? `${sorted[i] + 1}` : `${sorted[i] + 1}-${sorted[j] + 1}`);\n    i = j;\n  }\n  return parts.join(', ');\n}\n","@app/core/pdf-worker.js":"// Client for the pdf-lib worker. The worker is a classic worker started from\n// a Blob URL that contains pdf-lib's UMD build followed by our worker code\n// (module workers from Blob URLs don't work on file:// pages). pdf-lib is\n// downloaded on the main thread, so it's fetched once and failures surface\n// here.\nimport { workerUrl } from '@app/core/worker-source.js';\n\nlet workerPromise = null;\nlet seq = 0;\nconst pending = new Map();\n\nexport class WorkerOpError extends Error {\n  constructor({ name, message }) {\n    super(message);\n    this.name = name || 'WorkerOpError';\n  }\n}\n\nasync function startWorker() {\n  const url = await workerUrl();\n  const worker = new Worker(url, { name: 'pdf-lib' });\n  worker.onmessage = (e) => {\n    const p = pending.get(e.data.id);\n    if (!p) return;\n    pending.delete(e.data.id);\n    p.resolve(e.data);\n  };\n  worker.onerror = (e) => {\n    const err = new Error(`pdf-lib worker failed: ${e.message || 'unknown error'}`);\n    for (const p of pending.values()) p.reject(err);\n    pending.clear();\n    workerPromise = null;\n  };\n  return worker;\n}\n\nfunction getWorker() {\n  if (!workerPromise) {\n    workerPromise = startWorker().catch((err) => {\n      workerPromise = null;\n      throw err;\n    });\n  }\n  return workerPromise;\n}\n\n/** Send a message; resolves with the raw reply. */\nexport async function callWorker(message, transfer = []) {\n  const worker = await getWorker();\n  const id = ++seq;\n  return new Promise((resolve, reject) => {\n    pending.set(id, { resolve, reject });\n    worker.postMessage({ ...message, id }, transfer);\n  });\n}\n\n/**\n * Run an op on a document. `getBytes()` is only called if the worker doesn't\n * already hold this document at `version`.\n */\nexport async function applyOp({ docId, version, newVersion, op, args, getBytes }) {\n  let reply = await callWorker({ type: 'apply', docId, version, newVersion, op, args });\n  if (reply.needBytes) {\n    const buffer = getBytes().slice().buffer; // keep our copy; transfer the clone\n    reply = await callWorker({ type: 'apply', docId, version, newVersion, op, args, bytes: buffer }, [buffer]);\n  }\n  if (!reply.ok) throw new WorkerOpError(reply.error ?? { message: 'operation failed' });\n  return { bytes: new Uint8Array(reply.bytes), pageCount: reply.pageCount, affected: reply.affected, value: reply.value };\n}\n\n/** Run a read-only op (e.g. exportPages) against the document at `version`. */\nexport async function runQuery({ docId, version, op, args, getBytes }) {\n  let reply = await callWorker({ type: 'run', docId, version, op, args });\n  if (reply.needBytes) {\n    const buffer = getBytes().slice().buffer;\n    reply = await callWorker({ type: 'run', docId, version, op, args, bytes: buffer }, [buffer]);\n  }\n  if (!reply.ok) throw new WorkerOpError(reply.error ?? { message: 'operation failed' });\n  return reply.value;\n}\n\nexport function closeWorkerDoc(docId) {\n  if (workerPromise) callWorker({ type: 'close', docId }).catch(() => {});\n}\n","@app/core/prefs.js":"// Preferences: synchronous reads from localStorage, mirrored to IndexedDB.\n//\n// localStorage gives synchronous access (the theme is applied before first\n// paint). But for file:// pages Chromium doesn't reliably keep it — we've\n// seen it come back empty after a reload — so every write is also stored in\n// IndexedDB, and loadPrefs() (awaited at startup) restores anything\n// localStorage lost. Failures are tolerated everywhere: blocked storage must\n// never break the app.\nimport { idb } from '@app/core/idb.js';\n\nconst PREFIX = 'pdfeditor.';\nconst memory = new Map(); // fallback when localStorage is unavailable\n\nfunction readRaw(key) {\n  try {\n    const raw = localStorage.getItem(PREFIX + key);\n    if (raw !== null) return raw;\n  } catch {\n    /* unavailable */\n  }\n  return memory.has(key) ? memory.get(key) : null;\n}\n\nfunction writeRaw(key, raw) {\n  memory.set(key, raw);\n  try {\n    localStorage.setItem(PREFIX + key, raw);\n  } catch {\n    /* unavailable: memory + IndexedDB still work */\n  }\n}\n\n/** Restore preferences that localStorage lost from the IndexedDB mirror. */\nexport async function loadPrefs() {\n  try {\n    const all = await idb.getAll('prefs');\n    for (const { key, raw } of all) {\n      if (readRaw(key) === null) writeRaw(key, raw);\n    }\n  } catch {\n    /* no IndexedDB: localStorage only */\n  }\n}\n\nexport function getPref(key, fallback = null) {\n  const raw = readRaw(key);\n  if (raw === null) return fallback;\n  try {\n    return JSON.parse(raw);\n  } catch {\n    return fallback;\n  }\n}\n\nexport function setPref(key, value) {\n  const raw = JSON.stringify(value);\n  writeRaw(key, raw);\n  idb.put('prefs', { key, raw }).catch(() => {});\n}\n\nexport function removePref(key) {\n  memory.delete(key);\n  try {\n    localStorage.removeItem(PREFIX + key);\n  } catch {\n    /* ignore */\n  }\n  idb.delete('prefs', key).catch(() => {});\n}\n","@app/core/recents.js":"// Recent files, kept in IndexedDB in this browser only. Metadata and a small\n// first-page thumbnail live in \"recents\"; the file bytes live separately in\n// \"recentFiles\" so listing recents never loads whole PDFs.\nimport { idb } from '@app/core/idb.js';\n\nexport const MAX_RECENTS = 12;\n/** Files larger than this are listed but not stored (re-open from disk). */\nexport const MAX_STORED_BYTES = 150 * 1024 * 1024;\n\nconst listeners = new Set();\nexport function onRecentsChange(fn) {\n  listeners.add(fn);\n  return () => listeners.delete(fn);\n}\nconst emit = () => listeners.forEach((fn) => fn());\n\n/** A stable id for a file's content (SHA-256, or a sampled hash fallback). */\nexport async function contentId(bytes) {\n  try {\n    const digest = await crypto.subtle.digest('SHA-256', bytes);\n    return [...new Uint8Array(digest).slice(0, 16)].map((b) => b.toString(16).padStart(2, '0')).join('');\n  } catch {\n    // FNV-1a over up to 64k sampled bytes + the length.\n    let h = 0x811c9dc5;\n    const step = Math.max(1, Math.floor(bytes.length / 65536));\n    for (let i = 0; i \u003c bytes.length; i += step) {\n      h ^= bytes[i];\n      h = Math.imul(h, 0x01000193);\n    }\n    return `f${(h >>> 0).toString(16)}-${bytes.length.toString(16)}`;\n  }\n}\n\nexport async function listRecents() {\n  try {\n    const all = await idb.getAll('recents');\n    return all.sort((a, b) => b.lastOpened - a.lastOpened);\n  } catch {\n    return [];\n  }\n}\n\n/**\n * Remember a file. `thumbnail` is an optional image Blob.\n * Returns false if storage isn't available.\n */\nexport async function addRecent({ id, name, bytes, pageCount, thumbnail = null, handle = null }) {\n  try {\n    const stored = bytes.length \u003c= MAX_STORED_BYTES;\n    const existing = await idb.get('recents', id);\n    const record = {\n      id,\n      name,\n      size: bytes.length,\n      pageCount,\n      lastOpened: Date.now(),\n      stored,\n      thumbnail: thumbnail ?? existing?.thumbnail ?? null,\n      // A FileSystemFileHandle lets \"Save\" write back after reopening.\n      handle: handle ?? existing?.handle ?? null,\n    };\n    try {\n      await idb.put('recents', record);\n    } catch {\n      await idb.put('recents', { ...record, handle: null }); // handle not storable here\n    }\n    if (stored) await idb.put('recentFiles', { id, bytes: new Blob([bytes], { type: 'application/pdf' }) });\n    await prune();\n    emit();\n    return true;\n  } catch {\n    return false;\n  }\n}\n\nexport async function setRecentThumbnail(id, thumbnail) {\n  try {\n    const rec = await idb.get('recents', id);\n    if (!rec) return;\n    rec.thumbnail = thumbnail;\n    await idb.put('recents', rec);\n    emit();\n  } catch {\n    /* ignore */\n  }\n}\n\n/** The stored bytes of a recent file, or null. */\nexport async function getRecentBytes(id) {\n  try {\n    const rec = await idb.get('recentFiles', id);\n    if (!rec) return null;\n    return new Uint8Array(await rec.bytes.arrayBuffer());\n  } catch {\n    return null;\n  }\n}\n\nexport async function removeRecent(id) {\n  try {\n    await idb.delete('recents', id);\n    await idb.delete('recentFiles', id);\n  } finally {\n    emit();\n  }\n}\n\nexport async function clearRecents() {\n  try {\n    await idb.clear('recents');\n    await idb.clear('recentFiles');\n  } finally {\n    emit();\n  }\n}\n\nasync function prune() {\n  const all = await listRecents();\n  for (const old of all.slice(MAX_RECENTS)) {\n    await idb.delete('recents', old.id);\n    await idb.delete('recentFiles', old.id);\n  }\n}\n","@app/core/settings.js":"// User preferences (Preferences dialog) and the window arrangement (panel\n// sizes/visibility), persisted in localStorage via prefs.js.\nimport { getPref, setPref, removePref } from '@app/core/prefs.js';\n\nexport const SETTING_DEFAULTS = {\n  toolsSide: 'left', // 'left' | 'right'\n  author: '', // name used on comments\n  defaultZoom: 'auto', // 'auto' | 'fit-width' | 'fit-page' | number\n  defaultLayout: 'continuous', // 'continuous' | 'single' | 'two-up' | 'two-up-cover'\n};\n\nexport const ARRANGEMENT_DEFAULTS = {\ ntry.pageCount !== this.current.pageCount,\n    };\n  }\n}\n","@app/core/version.js":"// The app version. build.mjs checks it matches package.json.\nexport const VERSION = '0.1.0';\n","@app/core/worker-source.js":"// Builds the source of our classic Blob workers: pdf-lib's UMD build (and\n// fflate's, for job workers) followed by the worker code. Library code is\n// downloaded once on the main thread and reused for every worker.\nimport { libUrl } from '@app/core/libs.config.js';\nimport { workerMain } from '@app/core/worker/worker-main.js';\nimport { opsSource, helpersSource, jobsSource } from '@app/core/ops/index.js';\n\nconst texts = new Map();\n\nfunction libText(name, file) {\n  const key = `${name}:${file}`;\n  if (!texts.has(key)) {\n    const p = fetch(libUrl(name, file)).then((res) => {\n      if (!res.ok) throw new Error(`${name} download failed (${res.status})`);\n      return res.text();\n    });\n    p.catch(() => texts.delete(key));\n    texts.set(key, p);\n  }\n  return texts.get(key);\n}\n\n/** A Blob URL for a worker. `zip: true` also bundles fflate (job workers). */\nexport async function workerUrl({ zip = false } = {}) {\n  const parts = [await libText('pdfLib', 'umd')];\n  if (zip) parts.push(await libText('fflate', 'umd'));\n  parts.push(`;(${workerMain.toString()})(${opsSource()}, ${helpersSource()}, ${jobsSource()});`);\n  return URL.createObjectURL(new Blob([parts.join('\\n')], { type: 'text/javascript' }));\n}\n","@app/core/worker/worker-main.js":"// The body of the pdf-lib worker. Serialised with toString() and run as a\n// classic worker (see core/pdf-worker.js), after pdf-lib's UMD build has\n// defined self.PDFLib. Must be self-contained.\n//\n// Protocol (main → worker):\n//   { id, type: 'apply', docId, version, newVersion, bytes?, op, args }\n//     Loads `bytes` if given, otherwise reuses the cached pdf-lib document,\n//     which must be at `version` (else replies { needBytes: true }). Runs the\n//     op, saves, and replies { bytes .PDFDocument.load(new Uint8Array(msg.bytes), { updateMetadata: false });\n        entry = { version: msg.version, doc };\n        docs.set(docId, entry);\n      }\n      if (!entry || entry.version !== msg.version) {\n        reply({ id, ok: false, needBytes: true });\n        return;\n      }\n      const fn = OPS[msg.op];\n      if (!fn) throw new Error(`Unknown operation ${msg.op}`);\n      // pdf-lib's removePage() doesn't invalidate its page cache (insertPage\n      // does), so a document kept across edits could hand out stale pages.\n      const freshPages = () => { try { entry.doc.pageCache.invalidate(); } catch (e) { /* older pdf-lib */ } };\n      freshPages();\n      const result = (await fn(L, entry.doc, msg.args || {}, { helpers: HELPERS })) || {};\n      freshPages();\n      if (type === 'run') {\n        // Read-only query: no save, no new version. Byte results are transferred.\n        const value = result.value;\n        const transfer = value && value.bytes instanceof Uint8Array ? [value.bytes.buffer] : [];\n        reply({ id, ok: true, value }, transfer);\n        return;\n      }\n      const saved = await entry.doc.save();\n      entry.version = msg.newVersion;\n      const buffer = saved.byteOffset === 0 && saved.byteLength === saved.buffer.byteLength\n        ? saved.buffer\n        : saved.slice().buffer;\n      reply({\n        id,\n        ok: true,\n        bytes: buffer,\n        pageCount: entry.doc.getPageCount(),\n        affected: Array.isArray(result.affected) ? result.affected : null,\n        value: result.value,\n      }, [buffer]);\n    } catch (err) {\n      // A failed op may have half-modified the cached document: drop it.\n      docs.delete(docId);\n      reply({ id, ok: false, error: { name: err && err.name, message: String((err && err.message) || err) } });\n    }\n  };\n}\n","@app/i18n/en.js":"// English strings. Keys are grouped by area. Placeholders use {name}.\nexport const en = {\n  // App\n  'app.name': 'PDF Editor',  => { try { localStorage.clear(); } catch { /* ignore */ } await clearAllStores(); } },\n  });\n}\n\nstart();\n","@app/tools/annotate.js":"// Commenting tools: comment, highlight, draw — plus a palette command for each\n// annotation tool and the Esc / Delete shortcuts while annotating.\nimport { implementTool } from '@app/tools/registry.js';\nimport { defineCommand } from '@app/ui/commands.js';\nimport { TOOLS } from '@app/ui/annotate/annotator.js';\n\nexport function registerAnnotateTools() {\n  implementTool('comment', ({ app }) => {\n    app.annotator.activate('select');\n    app.showPanel('comments');\n  });\n  implementTool('highlight', ({ app }) => app.annotator.activate('highlight'));\n  implementTool('draw', ({ app }) => app.annotator.activate('ink'));\n}\n\nexport function registerAnnotateCommands(app) {\n  const a = () => app.annotator;\n  const hasDoc = () => !!app.activeTab && !app.organizerOpen;\n  for (const tool of TOOLS) {\n    defineCommand({ id: `annotate.${tool}`, label: `command.annot.${tool}`, enabled: hasDoc, checked: () => a().tool === tool, run: () => a().activate(tool) });\n  }\n  defineCommand({ id: 'annotate.done', label: 'command.annot.done', enabled: () => !!a().tool, run: () => a().deactivate() });\n  defineCommand({ id: 'annotate.delete', label: 'annot.delete', shortcut: ['Delete', 'Backspace'], hidden: true, enabled: () => !!a().selected() && !app.organizerOpen, run: () => a().deleteSelected() });\n  defineCommand({ id: 'annotate.escape', label: 'annot.done', shortcut: 'Escape', hidden: true, enabled: () => a().canEscape && !app.organizerOpen && !app.findBar.isOpen, run: () => a().escape() });\n}\n","@app/tools/catalogue.js":"// The complete tool catalogue. Every planned tool is defined here as\n// \"Coming soon\"; each tool's module calls implementTool() when it's built.\nimport { defineTool } from '@app/tools/registry.js';\n\nconst CATALOGUE = [\n  // Read\n  { id: 'read-mode', category: 'read', icon: 'bookOpen', milestone: 'M1' },\n  { id: 'comment', category: 'read', icon: 'messageSquare', milestone: 'M8' },\n  { id: 'highlight', category: 'read', icon: 'highlighter', milestone: 'M8' },\n  { id: 'draw', category: 'read', icon: 'pen', milestone: 'M8' },\n\n  // Find\n  { id: 'find', category: 'find', icon: 'search', shortcut: 'Mod+F', milestone: 'M3' },\n  { id: 'bookmarks', category: 'find', icon: 'bookmark', milestone: 'M3' },\n  { id: 'page-thumbnails', category: 'find', icon: 'grid', milestone: 'M3' },\n\n  // Organize\n  { id: 'organize-pages', category: 'organize', icon: 'layoutPages', milestone: 'M5' },\n  { id: 'rotate-pages', category: 'organize', icon: 'rotateCw', milestone: 'M5' },\n  { id: 'insert-pages', category: 'organize', icon: 'filePlus', milestone: 'M5' },\n  { id: 'delete-pages', category: 'organize', icon: 'trash', milestone: 'M5' },\n  { id: 'extract-pages', category: 'organize', icon: 'fileOutput', milestone: 'M6' },\n\n  // Combine & split\n  { id: 'combine-files', category: 'combine', icon: 'files', milestone: 'M6' },\n  { id: 'split-document', category: 'combine', icon: 'scissors', milestone: 'M6' },\n\n  // Protect\n  { id: 'redact', category: 'protect', icon: 'redact', milestone: 'M10' },\n  { id: 'sanitize', category: 'protect', icon: 'shieldCheck', milestone: 'M10' },\n  { id: 'protect-password', category: 'protect', icon: 'lock', milestone: 'M10' },\n\n  // Forms & layers\n  { id: 'fill-form', category: 'forms', icon: 'textInput', milestone: 'M9' },\n  { id: 'add-signature', category: 'forms', icon: 'signature', milestone: 'M9' },\n  { id: 'prepare-form', category: 'forms', icon: 'squarePlus', milestone: 'M9' },\n  { id: 'flatten-form', category: 'forms', icon: 'stamp', milestone: 'M9' },\n  { id: 'layers', category: 'forms', icon: 'layers', milestone: 'M7' },\n\n  // Scan & OCR\n  { id: 'ocr', category: 'ocr', icon: 'scanText', milestone: 'M11' },\n\n  // Everywhere\n  { id: 'print', category: 'everywhere', icon: 'printer', shortcut: 'Mod+P', milestone: 'M10' },\n  { id: 'properties', category: 'everywhere', icon: 'info', milestone: 'M7' },\n  { id: 'attachments', category: 'everywhere', icon: 'paperclip', milestone: 'M7' },\n  { id: 'accessibility-check', category: 'everywhere', icon: 'accessibility', milestone: 'M12' },\n  { id: 'undo-history', category: 'everywhere', icon: 'history', milestone: 'M4' },\n];\n\n/** Tools featured on the home screen. */\nexport const RECOMMENDED = [\n  'organize-pages',\n  'combine-files',\n  'comment',\n  'fill-form',\n  'redact',\n  'ocr',\n];\n\nexport function registerCatalogue() {\n  for (const def of CATALOGUE) defineTool(def);\n}\n","@app/tools/combine.js":"// Combine & split tools, and Extract pages (Organize).\nimport { implementTool } from '@app/tools/registry.js';\n\nexport function registerCombineTools() {\n  implementTool('combine-files', ({ app }) => app.openCombine());\n  implementTool('split-document', ({ app }) => app.openSplit());\n  implementTool('extract-pages', ({ app }) => app.openExtract());\n}\n","@app/tools/history.js":"// Undo history tool: opens the Undo History panel.\nimport { implementTool } from '@app/tools/registry.js';\n\nexport function registerHistoryTool() {\n  implementTool('undo-history', ({ app }) => app.showPanel('history'));\n}\n","@app/tools/info.js":"// Document information tools: properties, attachments, layers.\nimport { implementTool } from '@app/tools/registry.js';\n\nexport function registerInfoTools() {\n  implementTool('properties', ({ app }) => app.showPanel('properties'));\n  implementTool('attachments', ({ app }) => app.showPanel('attachments'));\n  implementTool('layers', ({ app }) => app.showPanel('layers'));\n}\n","@app/tools/navigation.js":"// Find tools: Find text, Bookmarks, Page thumbnails.\nimport { implementTool } from '@app/tools/registry.js';\n\nexport function registerNavigationTools() {\n  implementTool('find', ({ app }) => app.openFind());\n  implementTool('bookmarks', ({ app }) => app.showPanel('bookmarks'));\n  implementTool('page-thumbnails', ({ app }) => app.showPanel('pages'));\n}\n","@app/tools/organize.js":"// Organize tools: all open the page organizer grid.\nimport { implementTool } from '@app/tools/registry.js';\n\nexport function registerOrganizeTools() {\n  for (const id of ['organize-pages', 'rotate-pages', 'insert-pages', 'delete-pages']) {\n    implementTool(id, ({ app }) => app.openOrganizer());\n  }\n}\n","@app/tools/read-mode.js":"// Read mode: hide all chrome and show only the pages. Esc exits.\nimport { implementTool } from '@app/tools/registry.js';\n\nexport function registerReadMode() {\n  implementTool('read-mode', ({ app }) => app.toggleReadMode());\n}\n","@app/tools/registry.js":"// Central tool registry.\n//\n// Every tool is *defined* up front in catalogue.js (metadata, status \"soon\")\n// so the catalogue is complete from day one. A tool's own module later calls\n// implementTool(id, run) which flips its status to \"ready\". The UI (tools\n// panel, home catalogue, command palette) reads only from this registry.\n\nexport const CATEGORIES = [\n  'read',\n  'find',\n  'organize',\n  'combine',\n  'protect',\n  'forms',\n  'ocr',\n  'everywhere',\n];\n\nconst tools = new Map();\nconst listeners = new Set();\n\n/**\n * @typedef {Object} ToolDef\n * @property {string} id          kebab-case id, unique\n * @property {string} label       i18n key for the visible name\n * @property {string} description i18n key for the one-line description\n * @property {string} category    one of CATEGORIES\n * @property {string} icon        icon name from ui/icons.js\n * @property {string} [shortcut]  e.g. \"Mod+F\" (Mod = ⌘ on macOS, Ctrl elsewhere)\n * @property {string} milestone   the milestone that builds it, e.g. \"M5\"\n * @property {'ready'|'soon'} status\n * @property {(ctx: object) => any} [run]\n */\n\nexport function defineTool(def) {\n  if (!/^[a-z][a-z0-9-]*$/.test(def.id)) throw new Error(`Bad tool id: ${def.id}`);\n  if (tools.has(def.id)) throw new Error(`Tool defined twice: ${def.id}`);\n  if (!CATEGORIES.includes(def.category)) {\n    throw new Error(`Tool ${def.id} has unknown category: ${def.category}`);\n  }\n  const tool = {\n    label: `tool.${def.id}.label`,\n    description: `tool.${def.id}.desc`,\n    shortcut: null,\n    ...def,\n    status: 'soon',\n    run: null,\n  };\n  tools.set(tool.id, tool);\n  emit();\n  return tool;\n}\n\n/** Called by a tool's own module once it is built. */\nexport function implementTool(id, run) {\n  const tool = tools.get(id);\n  if (!tool) throw new Error(`implementTool: unknown tool ${id}`);\n  if (typeof run !== 'function') throw new Error(`implementTool: ${id} needs a run()`);\n  tool.run = run;\n  tool.status = 'ready';\n  emit();\n  return tool;\n}\n\nexport function getTool(id) {\n  return tools.get(id) ?? null;\n}\n\nexport function listTools({ category, status } = {}) {\n  return [...tools.values()].filter(\n    (t) => (!category || t.category === category) && (!status || t.status === status),\n  );\n}\n\nexport function toolsByCategory() {\n  return CATEGORIES.map((category) => ({ category, tools: listTools({ category }) }));\n}\n\n/** Run a tool. Tools that aren't built yet are refused, never faked. */\nexport async function runTool(id, ctx = {}) {\n  const tool = tools.get(id);\n  if (!tool) throw new Error(`Unknown tool: ${id}`);\n  if (tool.status !== 'ready') return { ok: false, reason: 'soon' };\n  return { ok: true, value: await tool.run(ctx) };\n}\n\nexport function onRegistryChange(fn) {\n  listeners.add(fn);\n  return () => listeners.delete(fn);\n}\n\nfunction emit() {\n  for (const fn of listeners) fn();\n}\n","@app/ui/about.js":"// Help → About and Help → Keyboard shortcuts.\nimport { h } from '@app/ui/dom.js';\nimport { logo } from '@app/ui/icons.js';\nimport { t } from '@app/i18n/index.js';\nimport { openDialog } from '@app/ui/dialog.js';\nimport { formatShortcut } from '@app/ui/keys.js';\nimport { listCommands } from '@app/ui/commands.js';\nimport { LIBS  message;\n    if (err?.name === 'InvalidPDFException') message = t('open.error.invalid');\n    else if (err?.name === 'MissingPDFException') message = t('open.error.missing');\n    else if (/fetch|import|load|network/i.test(err?.message ?? '') && !navigator.onLine) message = t('open.error.offline');\n    else message = t('open.error.generic', { message: err?.message ?? String(err) });\n    alertDialog({ title: t('open.error.title', { name }), message });\n  }\n\n  showLoading(name) {\n    const bar = h('div.progress-bar', h('div.progress-fill'));\n    const el = h('div.loading', { role: 'status', 'aria-live': 'polite' },\n      h('div.spinner', { 'aria-hidden': 'true' }),\n      h('span', t('open.loading', { name })),\n      bar,\n    );\n    let shown = false;\n    const timer = setTimeout(() => {\n      shown = true;\n      this.shell.main.append(el);\n    }, LOADING_DELAY);\n    return {\n      progress: (f) => bar.firstChild.style.setProperty('width', `${Math.round(f * 100)}%`),\n      pause: () => { el.hidden = true; },\n      resume: () => { el.hidden = false; },\n      done: () => {\n        clearTimeout(timer);\n        if (shown) el.remove();\n      },\n    };\n  }\n\n  async openExternalLink(url) {\n    let parsed;\n    try {\n      parsed = new URL(url);\n    } catch {\n      return;\n    }\n    if (!['http:', 'https:', 'mailto:'].includes(parsed.protocol)) {\n      alertDialog({ title: t('link.title'), message: t('link.unsupported', { url }) });\n      return;\n    }\n    const ok = await confirmDialog({\n      title: t('link.title'),\n      message: [h('p', t('link.message')), h('p.link-url', url)],\n      confirmLabel: t('link.open'),\n    });\n    if (ok) window.open(parsed.href, '_blank', 'noopener,noreferrer');\n  }\n\n  // --------------------------------------------- read mode / full screen\n\n  toggleReadMode() {\n    if (this.readMode) this.exitReadMode();\n    else this.enterReadMode();\n  }\n\n  enterReadMode() {\n    if (!this.activeTab) {\n onst result = await job.promise;\n      const base = tab.name.replace(/\\.pdf$/i, '');\n      const name = `${base} (${tn('organize.extractName', pages.length, { range: formatPageRange(pages) })}).pdf`;\n      await this.openBytes(result.bytes, name, { clean: false, openLabel: t('history.extracted', { name: tab.name }) });\n      return true;\n    } catch (err) {\n      toast(t('edit.failed', { message: err.message }), { kind: 'error' });\n      return false;\n    }\n  }\n\n  // ---------------------------------------------------------- organize\n\n  openOrganizer() {\n    const tab = this.activeTab;\n    if (!tab) {\n      toast(t('organize.needsDocument'));\n      return null;\n    }\n    this.closeFind();\n    tab.organizer ??= new Organizer(this, tab);\n    tab.organizer.show();\n    this.dispatchEvent(new CustomEvent('organizerchange'));\n    return tab.organizer;\n  }\n\n  closeOrganizer() {\n    const tab = this.activeTab;\n    const org = tab?.organizer;\n    if (!org?.isOpen) return;\n    org.hide();\n    tab.viewer.goToPage(org.focus + 1);\n    tab.viewer.focus();\n    this.dispatchEvent(new CustomEvent('organizerchange'));\n  }\n\n  get organizerOpen() {\n    return !!this.activeTab?.organizer?.isOpen;\n  }\n\n  // -------------------------------------------------------------- find\n\n  findController(tab) {\n    if (!tab) return null;\n    tab.find ??= new FindController(tab.viewer);\n    return tab.find;\n  }\n\n  openFind() {\n    if (!this.activeTab) {\n      toast(t('find.needsDocument'));\n      return;\n    }\n    this.findBar.open();\n  }\n\n  closeFind() {\n    if (!this.findBar?.isOpen) return;\n    this.findBar.close();\n    this.viewer?.focus();\n  }\n\n  // ------------------------------------------------------ tools/palette\n\n  async useTool(id) {\n    const tool = getTool(id);\n    if (!tool) return;\n    if (tool.status !== 'ready') {\n      toast(t('status.soonToast', { name: t(tool.label) }));\n      return;\n    }\n    await runTool(id {\n      if (!hasFiles(e)) return;\n      e.preventDefault();\n      e.dataTransfer.dropEffect = 'copy';\n    });\n    window.addEventListener('dragleave', (e) => {\n      if (!hasFiles(e)) return;\n      depth = Math.max(0, depth - 1);\n      if (depth === 0) overlay.hidden = true;\n    });\n    window.addEventListener('drop', async (e) => {\n      if (!hasFiles(e)) return;\n      e.preventDefault();\n      depth = 0;\n      overlay.hidden = true;\n      // File handles must be requested synchronously, during the drop event.\n      const handlePromises = [...e.dataTransfer.items]\n        .filter((item) => item.kind === 'file')\n        .map((item) => item.getAsFileSystemHandle?.().catch(() => null) ?? Promise.resolve(null));\n      const files = [...e.dataTransfer.files];\n      const handles = await Promise.all(handlePromises);\n      const isPdf = (f) => f.type === 'application/pdf' || /\\.pdf$/i.test(f.name);\n      const picked = files.some(isPdf) ? files.filter(isPdf) : files.slice(0, 1);\n      for (const file of picked) {\n        const handle = handles[files.indexOf(file)];\n        await this.openFile(file, handle?.kind === 'file' ? handle : null);\n      }\n    });\n  }\n}\n","@app/ui/canvas-encode.js":"// Encode a canvas to an image Blob reliably.\n//\n// Chromium runs canvas.toBlob() encoding in idle time; on a busy page its\n// callback can be postponed for many seconds (we saw thumbnails stall). So we\n// give toBlob() a short head start and otherwise encode synchronously with\n// toDataURL() — a small thumbnail costs a few milliseconds.\n\nexport async function canvasToBlob(canvas, type = 'image/png', { timeout = 800 } = {}) {\n  const viaToBlob = new Promise((resolve) => {\n    try {\n      canvas.toBlob((b) => resolve(b), type);\n    } catch {\n      resolve(null);\n    }\n  });\n  const timer = new Promise((resolve) => setTimeout(() => resolve('timeout'), timeout));\n  const result = await Promise.race([viaToBlob, timer]);\n  if (result && result h a shortcut string? */\nexport function matchShortcut(event, shortcut) {\n  const parts = shortcut.split('+');\n  const key = parts.at(-1);\n  const want = new Set(parts.slice(0, -1));\n  const mod = IS_MAC ? event.metaKey : event.ctrlKey;\n  if (want.has('Mod') !== mod) return false;\n  if (want.has('Alt') !== event.altKey) return false;\n  if (IS_MAC && want.has('Ctrl') !== event.ctrlKey) return false;\n  const agnostic = SHIFT_AGNOSTIC[key];\n  if (agnostic) return agnostic.includes(event.key);\n  if (want.has('Shift') !== event.shiftKey) return false;\n  return event.key.toLowerCase() === key.toLowerCase();\n}\n","@app/ui/menu.js":"// Popup menus (role=\"menu\") with full keyboard support. Used by the menu bar,\n// the status bar pickers and context menus.\nimport { h } from '@app/ui/dom.js';\nimport { icon } from '@app/ui/icons.js';\nimport { formatShortcut } from '@app/ui/keys.js';\n\nlet openMenuState = null;\n\n/**\n * @typedef {Object} MenuItem\n * @property {string} label\n * @property {string} [icon]\n * @property {string} [shortcut]\n * @property {string} [hint]       right-aligned note, e.g. \"Coming soon\"\n * @property {'menuitem'|'menuitemradio'|'menuitemcheckbox'} [role]\n * @property {boolean} [checked]\n * @property {boolean} [disabled]\n * @property {string} [id]\n * @property {() => void} run\n */\n\n/**\n * Open a menu attached to an anchor element (or at a point, for context menus).\n * @param {HTMLElement} anchor   focus returns here; aria-expanded is managed on it\n * @param {(MenuItem|'separator')[]} items\n * @param {object} [o]\n * @param {'below'|'above'} [o.placement]\n * @param {string} [o.label]\n * @param {{x:number,y:number}} [o.at]   open at this viewport point\n * @param {(dir: -1|1) => void} [o.onNavigate]  ←/→ pressed (menu bars)\n * @param {boolean} [o.focusFirst]  focus the first item (default true)\n * @param {() => void} [o.onClose]\n */\nexport function openMenu(anchor, items, { placement = 'below', label, at, onNavigate, focusFirst = true, onClose } = {}) {\n  closeMenu();\n  const menu = h('div.menu', {\n    role: 'menu',\n    'aria-label': label ?? anchor?.getAttribute('aria-label') ?? anchor?.textContent ?? null,\n    tabindex: '-1',\n  });\n  const entries = [];\n  for (const item of items) {\n    if (item === 'separator') {\n      if (menu.lastChild && !menu.lastChild.classList.contains('menu-separator')) {\n        menu.append(h('div.menu-separator', { role: 'separator' }));\n      }\n      continue;\n    }\n    const role = item.role ?? 'menuitem';\n    const el = h('button.menu-item', {\n      type: 'button',\n      role,\n      tabindex: '-1',\n      'aria-checked': role === 'menuitem' ? null : String(!!item.checked),\n      'aria-disabled': item.disabled ? 'true' : null,\n      dataset: item.id ? { id: item.id } : {},\n    },\n      h('span.menu-check', role !== 'menuitem' && item.checked ? icon('check', { size: 14 }) : null),\n      item.icon ? icon(item.icon) : h('span.menu-icon-space'),\n      h('span.menu-label', item.label),\n      item.hint ? h('span.menu-hint', item.hint) : null,\n      item.shortcut ? h('span.menu-shortcut', formatShortcut(item.shortcut)) : null,\n    );\n    el.addEventListener('click', () => {\n      if (item.disabled) return;\n      closeMenu({ restoreFocus: true });\n      item.run();\n    });\n    el.addEventListener('pointerenter', () => {\n      if (!item.disabled) el.focus({ preventScroll: true });\n    });\n    entries.push({ el, item });\n    menu.append(el);\n  }\n  if (menu.lastChild?.classList.contains('menu-separator')) menu.lastChild.remove();\n\n  document.body.append(menu);\n  if (at) positionAt(menu, at);\n  else position(menu, anchor, placement);\n  anchor?.setAttribute('aria-expanded', 'true');\n\n  const enabled = () => entries.filter((e) => !e.item.disabled);\n  const focusAt = (i) => {\n    const list = enabled();\n    if (!list.length) return menu.focus();\n    list[(i + list.length) % list.length].el.focus();\n  };\n  const focusedIndex = () => enabled().findIndex((e) => e.el === document.activeElement);\n\n  const onKey = (e) => {\n    switch (e.key) {\n      case 'ArrowDown': e.preventDefault(); focusAt(focusedIndex() + 1); break;\n      case 'ArrowUp': e.preventDefault(); focusAt(focusedIndex() \u003c 0 ? -1 : focusedIndex() - 1); break;\n      case 'Home': e.preventDefault(); focusAt(0); break;\n      case 'End': e.preventDefault(); focusAt(-1); break;\n      case 'ArrowLeft':\n      case 'ArrowRight':\n        if (onNavigate) {\n          e.preventDefault();\n          onNavigate(e.key === 'ArrowLeft' ? -1 : 1);\n        }\n        break;\n      case 'Escape': e.preventDefault(); e.stopPropagation(); closeMenu({ restoreFocus: true }); break;\n      case 'Tab': e.preventDefault(); closeMenu({ restoreFocus: true }); break;\n      default: {\n        // Type-ahead: jump to the next item starting with the typed letter.\n        if (e.key.length === 1 && /\\S/.test(e.key) && !e.ctrlKey && !e.metaKey) {\n          const list = enabled();\n          const start = focusedIndex();\n          for (let k = 1; k \u003c= list.length; k++) {\n            const cand = list[(start + k) % list.length];\n            if (cand.item.label.toLowerCase().startsWith(e.key.toLowerCase())) {\n              cand.el.focus();\n              break;\n            }\n          }\n        }\n      }\n    }\n  };\n  const onPointer = (e) => {\n    if (!menu.contains(e.target) && !anchor?.contains(e.target)) closeMenu();\n  };\n  menu.addEventListener('keydown', onKey);\n  document.addEventListener('pointerdown', onPointer, true);\n  window.addEventListener('blur', closeMenu);\n  window.addEventListener('resize', closeMenu);\n\n  openMenuState = {\n    menu,\n    anchor,\n    onClose,\n    cleanup: () => {\n      document.removeEventListener('pointerdown', onPointer, true);\n      window.removeEventListener('blur', closeMenu);\n      window.removeEventListener('resize', closeMenu);\n    },\n  };\n  if (focusFirst) {\n    const checked = enabled().findIndex((e) => e.item.checked);\n    focusAt(Math.max(0, checked));\n  } else {\n    menu.focus();\n  }\n  return menu;\n}\n\nexport function closeMenu({ restoreFocus = false } = {}) {\n  if (!openMenuState) return;\n  const { menu, anchor, cleanup, onClose } = openMenuState;\n  openMenuState = null;\n  cleanup();\n  menu.remove();\n  anchor?.setAttribute('aria-expanded', 'false');\n  onClose?.();\n  if (restoreFocus) anchor?.focus();\n}\n\nexport function isMenuOpen() {\n  return !!openMenuState;\n}\n\nexport function openMenuAnchor() {\n  return openMenuState?.anchor ?? null;\n}\n\nfunction position(menu, anchor, placement) {\n  const r = anchor.getBoundingClientRect();\n  const m = menu.getBoundingClientRect();\n  const margin = 4;\n  let top = placement === 'above' ? r.top - m.height - margin : r.bottom + margin;\n  if (top \u003c margin) top = r.bottom + margin;\n  if (top + m.height > innerHeight - margin) top = Math.max(margin, r.top - m.height - margin);\n  const left = Math.min(r.left, innerWidth - m.width - margin);\n  menu.style.top = `${Math.max(margin, top)}px`;\n  menu.style.left = `${Math.max(margin, left)}px`;\n}\n\nfunction positionAt(menu, { x, y }) {\n  const m = menu.getBoundingClientRect();\n  const margin = 4;\n  menu.style.left = `${Math.max(margin, Math.min(x, innerWidth - m.width - margin))}px`;\n  menu.style.top = `${Math.max(margin, Math.min(y, innerHeight - m.height - margin))}px`;\n}\n","@app/ui/menubar.js":"// Application menu bar (role=\"menubar\") with roving focus. Each top-level\n// item opens a menu whose items are built fresh (so enabled/checked states\n// are always current).\nimport { h } from '@app/ui/dom.js';\nimport { openMenu, closeMenu, isMenuOpen, openMenuAnchor } from '@app/ui/menu.js';\n\n/** @param {{ id:string, label:string, items: () => any[] }[]} menus */\nexport function createMenubar(menus, { label }) {\n  const bar = h('div.menubar', { role: 'menubar', 'aria-label': label });\n it.y, w: x1 - x0, h: y1 - y0 };\n        visible.push({ i, rect });\n        if (rect.w * rect.h > bestArea) {\n          bestArea = rect.w * rect.h;\n          best = i;\n        }\n      }\n    }\n    if (this.mode !== 'single' && best >= 0) this.setCurrent(best);\n    this.visible = visible.map((v) => v.i);\n\n    if (performance.now() \u003c this.holdUntil) return; // zooming: wait, then render sharp\n    this.schedule(visible);\n  }\n\n  renderParams() {\n    return {\n      zoom: this.zoom,\n      scale: this.layout.scale,\n      rotation: this.rotation,\n      dpr: Math.min(window.devicePixelRatio || 1, 4),\n    };\n  }\n\n  schedule(visible) {\n    const params = this.renderParams();\n    this.params = params;\n    const key = `${params.scale}|${params.rotation}|${params.dpr}`;\n    if (!visible.length) {\n      visible = this.layout.items[this.current] ? [{ i: this.current, rect: null }] : [];\n    }\n    const lo = Math.min(...visible.map((v) => v.i));\n    const hi = Math.max(...visible.map((v) => v.i));\n\n    // Release pages far from view; cancel renders that are out of date.\n    this.views.forEach((v, i) => {\n      const far = i \u003c lo - KEEP || i > hi + KEEP || !this.layout.items[i];\n      if (far && (v.hasContent || v.busy)) v.release();\n      else if (v.busy && v.runKey !== key) v.cancel();\n    });\n\n    const queue = visible.map((v) => ({ view: this.views[v.i], rect: v.rect }));\n    for (let d = 1; d \u003c= PREFETCH; d++) {\n      for (const i of [hi + d, lo - d]) {\n        if (i >= 0 && i \u003c this.numPages && this.layout.items[i]) queue.push({ view: this.views[i], rect: null });\n      }\n    }\n    this.queue = queue;\n    this.pump(key);\n  }\n\n  pump(key) {\n    while (this.running \u003c MAX_CONCURRENT && this.queue.length) {\n      const { view, rect } = this.queue.shift();\n      if (view.busy) continue;\n      const item = this.layout.items[view.index];\n      if (!view.prepare(this.params, item, rect)) continue;\n      vie   <script>
(function () {
  var data = document.getElementById('app-modules');
  function fail(err) {
    var app = document.getElementById('app');
    var box = document.createElement('div');
    box.className = 'boot-error';
    box.setAttribute('role', 'alert');
    box.textContent = 'PDF Editor could not start: ' + (err && err.message ? err.message : err);
    app.replaceChildren(box);
    app.removeAttribute('aria-busy');
    console.error(err);
  }
  if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
    fail(new Error('this browser is too old (it needs ES module import maps).'));
    return;
  }
  try {
    var sources = JSON.parse(data.textContent);
    var imports = {};
    for (var id in sources) {
      var code = sources[id] + '\n//# sourceURL=pdf-editor:///' + id.slice(5);
      imports[id] = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    }
    var map = document.createElement('script');
    map.type = 'importmap';
    map.textContent = JSON.stringify({ imports: imports });
    document.head.appendChild(map);
    window.__pdfEditorBootFail = fail;
    var entry = document.createElement('script');
    entry.type = 'module';
    entry.textContent = 'import("@app/main.js").catch(function (e) { window.__pdfEditorBootFail(e); });';
    document.body.appendChild(entry);
  } catch (err) {
    fail(err);
  }
})();
